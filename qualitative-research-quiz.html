<title>Qualitative Research Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Single-column quiz: sticky score bar on top, question cards below, instant right/wrong feedback */
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8;
    --accent: #3a5bd9; --good: #1e8e4e; --good-bg: #e3f5ea; --bad: #c4352b; --bad-bg: #fde9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --card: #1b2029; --text: #e8ebf2; --muted: #98a1b3; --line: #2c3340;
      --accent: #7f9bff; --good: #52d28a; --good-bg: #16301f; --bad: #ff7b70; --bad-bg: #3a1c1a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --card: #1b2029; --text: #e8ebf2; --muted: #98a1b3; --line: #2c3340;
    --accent: #7f9bff; --good: #52d28a; --good-bg: #16301f; --bad: #ff7b70; --bad-bg: #3a1c1a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.05rem; margin: 0; }
  .stats { display: flex; gap: 14px; font-size: .9rem; color: var(--muted); }
  .stats b { color: var(--text); }
  .stats .ok b { color: var(--good); } .stats .no b { color: var(--bad); }
  .progress { height: 4px; background: var(--line); margin: 8px auto 0; border-radius: 2px; overflow: hidden; max-width: 760px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  main { max-width: 760px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tool { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: .9rem; }
  .tool.on { border-color: var(--accent); color: var(--accent); }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .q h2 { font-size: 1rem; margin: 0 0 10px; font-weight: 600; }
  .q h2 span { color: var(--accent); margin-right: 6px; }
  .opt { display: block; width: 100%; text-align: left; background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt b { margin-right: 6px; color: var(--muted); }
  .opt.correct { background: var(--good-bg); border-color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .msg { margin-top: 10px; font-size: .92rem; font-weight: 600; }
  .msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
  #done { text-align: center; padding: 20px; font-size: 1.1rem; }
</style>
<header>
  <div class="bar">
    <h1>Qualitative Research Quiz</h1>
    <div class="stats">
      <span>Answered <b id="sAns">0</b>/<b id="sTot">0</b></span>
      <span class="ok">Correct <b id="sOk">0</b></span>
      <span class="no">Wrong <b id="sNo">0</b></span>
    </div>
  </div>
  <div class="progress"><i id="bar"></i></div>
</header>
<main>
  <div class="tools">
    <button class="tool" id="fUn">Show unanswered only</button>
    <button class="tool" id="fWr">Show wrong only</button>
    <button class="tool" id="shuf">Shuffle questions</button>
    <button class="tool" id="reset">Reset all</button>
  </div>
  <div id="list"></div>
  <div id="done" class="q" hidden></div>
</main>

const LS = "qr-quiz-v1";
const L = ["a","b","c","d"];
let order = DATA.map(d => d[0]);
let saved = {}; // question number -> chosen index
let filter = "all";
try { saved = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) {}
function persist() { try { localStorage.setItem(LS, JSON.stringify(saved)); } catch (e) {} }
const byNum = n => DATA.find(d => d[0] === n);

const list = document.getElementById("list");

function render() {
  list.innerHTML = "";
  order.forEach(n => {
    const [num, text, opts, ans] = byNum(n);
    const chosen = saved[num];
    const answered = chosen !== undefined;
    if (filter === "unanswered" && answered) return;
    if (filter === "wrong" && !(answered && chosen !== ans)) return;

    const card = document.createElement("div");
    card.className = "q";
    const h = document.createElement("h2");
    h.innerHTML = "<span>" + num + ".</span>";
    h.appendChild(document.createTextNode(text));
    card.appendChild(h);

    opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = "<b>" + L[i] + ")</b>";
      b.appendChild(document.createTextNode(o));
      if (answered) {
        b.disabled = true;
        if (i === ans) b.classList.add("correct");
        else if (i === chosen) b.classList.add("wrong");
      } else {
        b.onclick = () => { saved[num] = i; persist(); render(); };
      }
      card.appendChild(b);
    });

    if (answered) {
      const m = document.createElement("div");
      if (chosen === ans) { m.className = "msg good"; m.textContent = "✓ Correct!"; }
      else { m.className = "msg bad"; m.textContent = "✗ Wrong. The correct answer is " + L[ans] + ") " + opts[ans]; }
      card.appendChild(m);
    }
    list.appendChild(card);
  });
  stats();
}

function stats() {
  let ok = 0, no = 0;
  DATA.forEach(d => {
    const c = saved[d[0]];
    if (c === undefined) return;
    c === d[3] ? ok++ : no++;
  });
  const ans = ok + no, tot = DATA.length;
  sAns.textContent = ans; sTot.textContent = tot; sOk.textContent = ok; sNo.textContent = no;
  bar.style.width = (ans / tot * 100) + "%";
  const done = document.getElementById("done");
  if (ans === tot) {
    done.hidden = false;
    done.textContent = "Finished! You scored " + ok + " / " + tot + " (" + Math.round(ok / tot * 100) + "%).";
  } else done.hidden = true;
}

function setFilter(f) {
  filter = filter === f ? "all" : f;
  fUn.classList.toggle("on", filter === "unanswered");
  fWr.classList.toggle("on", filter === "wrong");
  render();
}
fUn.onclick = () => setFilter("unanswered");
fWr.onclick = () => setFilter("wrong");
shuf.onclick = () => {
  order = order.slice();
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  render();
};
let armed = false, armT;
reset.onclick = () => {
  if (!armed) {
    armed = true; reset.textContent = "Tap again to clear all answers";
    armT = setTimeout(() => { armed = false; reset.textContent = "Reset all"; }, 3000);
    return;
  }
  clearTimeout(armT); armed = false; reset.textContent = "Reset all";
  saved = {}; persist(); order = DATA.map(d => d[0]); filter = "all";
  fUn.classList.remove("on"); fWr.classList.remove("on");
  render(); window.scrollTo(0, 0);
};
render();
})();
</script>
