1},{"q":"What is the primary purpose of using “focus groups” in qualitative research?","o":["To collect large amounts of numerical data","To explore group dynamics and collective views","To ensure random sampling of participants","To perform statistical hypothesis testing"],"a":1,"l":"","ns":true,"t":"","n":72},{"q":"Which of the following is NOT a typical feature of a “case study” in qualitative research?","o":["In-depth exploration of a complex issue in its real-life context","Focus on data from a large, random sample","Collection of multiple sources of evidence","Study of a bounded system such as an individual, group, or organization"],"a":1,"l":"","ns":true,"t":"","n":73},{"q":"The process of “member checking” in qualitative research involves:","o":["The researcher verifying and validating the research findings with participants","The researcher selecting participants for data collection","Randomly selecting participants for data collection","The use of control groups to ensure accuracy"],"a":0,"l":"","ns":true,"t":"","n":74},{"q":"Which of the following qualitative research methods is most suitable for exploring participants’ life stories?","o":["Ethnography","Grounded theory","Phenomenology","Narrative inquiry"],"a":3,"l":"","ns":true,"t":"","n":75},{"q":"In qualitative research, “dependability” refers to:","o":["The consistency and reliability of the research findings over time","The generalizability of the findings to other populations","The ethical considerations of the study","The numerical accuracy of the data collected"],"a":0,"l":"","ns":true,"t":"","n":76},{"q":"What is the main purpose of “triangulation” in qualitative research?","o":["To increase the statistical power of the study","To verify findings by using multiple methods or sources","To select a random sample","To perform statistical analyses"],"a":1,"l":"","ns":true,"t":"","n":77},{"q":"Which of the following is an example of a “phenomenological” approach in qualitative research?","o":["Studying the lived experiences of individuals who have undergone a specific phenomenon","Conducting a large-scale survey on health behaviors","Analyzing the economic impact of a public policy","Testing a new educational intervention in a controlled setting"],"a":0,"l":"","ns":true,"t":"","n":78},{"q":"Which qualitative research method is most appropriate for studying the language and communication patterns within a community?","o":["Ethnography","Grounded theory","Discourse analysis","Phenomenology"],"a":2,"l":"","ns":true,"t":"","n":79},{"q":"Which of the following is NOT a common data collection method in qualitative research?","o":["Interviews","Surveys with closed-ended questions","Observations","Focus groups"],"a":1,"l":"","ns":true,"t":"","n":80},{"q":"Which of the following best describes “grounded theory”?","o":["A theory developed and tested in a controlled experiment","A theory derived inductively from the data collected during the research process","A theory that is pre-existing and used to guide data collection","A theory based on the statistical analysis of numerical data"],"a":1,"l":"","ns":true,"t":"","n":81},{"q":"What is the primary purpose of using “field notes” in qualitative research?","o":["To record numerical data for statistical analysis","To document the researcher’s observations, thoughts, and reflections during data collection","To summarize the results of the study","To create a coding framework"],"a":1,"l":"","ns":true,"t":"","n":82},{"q":"In qualitative research, “analytic memoing” refers to:","o":["Writing statistical summaries of the data","Recording and reflecting on the coding process and emerging themes","Creating a structured interview guide","Conducting a literature review"],"a":1,"l":"","ns":true,"t":"","n":83},{"q":"Which of the following best describes the role of “theoretical sampling” in grounded theory?","o":["Selecting participants randomly to increase generalizability","Selecting participants based on emerging theoretical concepts to further develop theory","Ensuring an equal representation of all demographic groups","Using a predetermined sample size for statistical analysis"],"a":1,"l":"","ns":true,"t":"","n":84},{"q":"What is the purpose of conducting a “pilot study” in qualitative research?","o":["To test the feasibility of the research design and methods before the main study","To collect a large sample for statistical testing","To finalize the coding framework","To perform the final analysis of the data"],"a":0,"l":"","ns":true,"t":"","n":85},{"q":"In qualitative research, “epistemology” refers to:","o":["The study of statistical methods","The philosophical study of knowledge, including its nature and origins","The coding of qualitative data","The practical application of research findings"],"a":1,"l":"","ns":true,"t":"","n":86},{"q":"Which of the following is an example of “purposive sampling” in qualitative research?","o":["Randomly selecting participants from a large population","Selecting participants who are most knowledgeable about the research topic","Ensuring an equal distribution of participants across demographic groups","Using statistical methods to select participants"],"a":1,"l":"","ns":true,"t":"","n":87},{"q":"What does the term “contextualization” mean in qualitative research?","o":["Analyzing data without considering the context in which it was collected","Understanding and interpreting data within the context in which it was collected","Using context-free variables in data analysis","Randomly assigning participants to different contexts"],"a":1,"l":"","ns":true,"t":"","n":88},{"q":"Which of the following best describes the concept of “thick description” in qualitative research?","o":["Providing a detailed and rich account of the research context and participants’ experiences","Reporting only the numerical results of a study","Using statistical tests to analyze qualitative data","Summarizing the key findings in a brief manner"],"a":0,"l":"","ns":true,"t":"","n":89},{"q":"Which of the following is a potential disadvantage of using interviews in qualitative research?","o":["The ability to gather in-depth information","The possibility of interviewer bias influencing participants’ responses","The flexibility to explore new topics","The opportunity to clarify questions for participants"],"a":1,"l":"","ns":true,"t":"","n":90},{"q":"In qualitative research, “axial coding” refers to:","o":["The initial process of breaking down data into discrete parts","The process of reassembling data after open coding to identify relationships between categories","The final stage of coding where themes are developed","The use of statistical software to code data"],"a":1,"l":"","ns":true,"t":"","n":91},{"q":"Which of the following is a key characteristic of “phenomenology” as a qualitative research approach?","o":["It aims to generate a new theory based on data","It focuses on understanding the essence of lived experiences","It involves the analysis of language and communication","It relies on numerical data to draw conclusions"],"a":1,"l":"","ns":true,"t":"","n":92},{"q":"What is the primary goal of “coding” in qualitative data analysis?","o":["To reduce the data into numerical form for statistical analysis","To organize and categorize data to identify patterns and themes","To increase the sample size of the study","To apply experimental controls to the study"],"a":1,"l":"","ns":true,"t":"","n":93},{"q":"Which of the following is an example of “negative case analysis” in qualitative research?","o":["Selecting only cases that support the findings","Using a statistical test to confirm reliability","Conducting the analysis with a larger sample size","Examining cases that do not fit the emerging pattern or theory"],"a":3,"l":"","ns":true,"t":"","n":94},{"q":"In qualitative research, the term “hermeneutics” is associated with:","o":["The interpretation of texts, meaning, and understanding","The measurement of participants’ behavior","The random selection of participants","The use of control groups in experiments"],"a":0,"l":"","ns":true,"t":"","n":95},{"q":"Which of the following is a characteristic of “participatory action research” (PAR)?","o":["The researcher acts as an objective observer, detached from the participants","The research is conducted with the active participation of the community or group being studied","The study is focused on generating statistical data for policy decisions","The findings are meant to remain confidential and not shared with participants"],"a":1,"l":"","ns":true,"t":"","n":96},{"q":"The concept of “transferability” in qualitative research is similar to which concept in quantitative research?","o":["Validity","Reliability","Generalizability","Statistical significance"],"a":2,"l":"","ns":true,"t":"","n":97},{"q":"In qualitative research, what is the purpose of using “open coding”?","o":["To create a detailed coding framework before data collection","To break down qualitative data into discrete parts and label them with codes","To increase the sample size for better reliability","To perform statistical analysis on qualitative data"],"a":1,"l":"","ns":true,"t":"","n":98},{"q":"Which of the following best describes the “constant comparative method” in grounded theory?","o":["Comparing the research findings with pre-existing theories","Continuously comparing data with emerging categories and concepts during analysis","Continuously comparing participants across different contexts","Randomly assigning participants to comparison groups"],"a":1,"l":"","ns":true,"t":"","n":99},{"q":"Which of the following would be considered a limitation of qualitative research?","o":["The ability to explore in-depth understanding","The potential for researcher bias influencing participants’ perspectives","The focus on understanding participants’ experiences","The use of small, purposive samples"],"a":3,"l":"","ns":true,"t":"","n":100}]};
const NOTES = document.getElementById("notesTpl").innerHTML;
const TOPICS = {
  LR: "Literature review", SAMP: "Sampling and setting", DATA: "Primary/secondary data",
  ETH: "Ethics", RIG: "Rigour", TECH: "Data management and software",
  FIND: "Findings and discussion", CONC: "Concluding chapter", REP: "Reporting and dissemination"
};
const TABS = [
  ["practice", "Practice", "250 questions drawn from the group presentations. Pick an answer to see instantly whether you are right; the correct answer and a key point always show."],
  ["hard", "Hard", "100 harder questions: scenarios, ‘best answer’ items and look-alike concepts."],
  ["past", "Past questions", "The 100 past questions from your photos."],
  ["notes", "Notes", "Highlighted summaries of every presentation, your saved key points, and a space for your own notes."]
];
const LS = "nursq-v1";
let st = { ans: {}, saved: {}, notes: "" };
try { const r = JSON.parse(localStorage.getItem(LS) || "null"); if (r && r.ans) st = Object.assign(st, r); } catch (e) {}
function persist() { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} }

let tab = "practice", topic = "all", filter = "all", orders = {};
const $ = id => document.getElementById(id);
const L = ["a", "b", "c", "d"];

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function perm(id, n, keep) {
  const a = Array.from({ length: n }, (_, i) => i);
  if (keep) return a;
  let s = hash(id) || 1;
  const rnd = () => { s = Math.imul(s ^ (s >>> 15), 1 | s); s ^= s + Math.imul(s ^ (s >>> 7), 61 | s); return ((s ^ (s >>> 14)) >>> 0) / 4294967296; };
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const items = key => BANK[key].map((q, i) => Object.assign({ id: key + ":" + i, n: i + 1 }, q));
const ITEMS = { practice: items("practice"), hard: items("hard"), past: items("past") };

function tabStats(key) {
  let ok = 0, no = 0;
  ITEMS[key].forEach(q => { const c = st.ans[q.id]; if (c === undefined) return; c === q.a ? ok++ : no++; });
  return { ok, no, ans: ok + no, tot: ITEMS[key].length };
}
function header() {
  const tb = $("tabs"); tb.innerHTML = "";
  TABS.forEach(([k, name]) => {
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", k === tab);
    b.textContent = name; b.onclick = () => { tab = k; topic = "all"; filter = "all"; render(); window.scrollTo(0, 0); };
    tb.appendChild(b);
  });
  const sw = $("sAns").parentNode.parentNode;
  if (tab === "notes") { sw.hidden = true; $("bar").style.width = "0"; return; }
  sw.hidden = false;
  const s = tabStats(tab);
  $("sAns").textContent = s.ans; $("sTot").textContent = s.tot; $("sOk").textContent = s.ok; $("sNo").textContent = s.no;
  $("bar").style.width = (s.ans / s.tot * 100) + "%";
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function render() {
  header();
  $("intro").textContent = TABS.find(t => t[0] === tab)[2];
  const v = $("view"); v.innerHTML = "";
  if (tab === "notes") return renderNotes(v);
  renderQuiz(v);
}

function renderQuiz(v) {
  const bar = el("div", "bar");
  if (tab !== "past") {
    const present = Object.keys(TOPICS).filter(k => ITEMS[tab].some(q => q.t === k));
    [["all", "All topics"]].concat(present.map(k => [k, TOPICS[k]])).forEach(([k, name]) => {
      const c = el("button", "chip", name); c.setAttribute("aria-pressed", topic === k);
      c.onclick = () => { topic = k; render(); }; bar.appendChild(c);
    });
  }
  v.appendChild(bar);
  const bar2 = el("div", "bar");
  const mk = (txt, on, fn) => { const b = el("button", "tool", txt); b.setAttribute("aria-pressed", on); b.onclick = fn; bar2.appendChild(b); return b; };
  mk("Unanswered only", filter === "un", () => { filter = filter === "un" ? "all" : "un"; render(); });
  mk("Wrong only", filter === "wr", () => { filter = filter === "wr" ? "all" : "wr"; render(); });
  mk("Shuffle order", false, () => {
    const a = ITEMS[tab].map(q => q.id);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    orders[tab] = a; render();
  });
  const rs = mk("Reset this tab", false, null);
  let armed = false, t;
  rs.onclick = () => {
    if (!armed) { armed = true; rs.textContent = "Tap again to clear answers"; t = setTimeout(() => { armed = false; rs.textContent = "Reset this tab"; }, 3000); return; }
    clearTimeout(t); ITEMS[tab].forEach(q => delete st.ans[q.id]); persist(); render();
  };
  v.appendChild(bar2);

  const list = orders[tab] ? orders[tab].map(id => ITEMS[tab].find(q => q.id === id)) : ITEMS[tab];
  let shown = 0;
  list.forEach(q => {
    const c = st.ans[q.id], done = c !== undefined;
    if (topic !== "all" && q.t !== topic) return;
    if (filter === "un" && done) return;
    if (filter === "wr" && !(done && c !== q.a)) return;
    shown++;
    const card = el("div", "q");
    const qh = el("div", "qh"); qh.appendChild(el("span", "tag", q.t ? TOPICS[q.t] : "Past question"));
    card.appendChild(qh);
    const h = el("h2"); h.appendChild(el("span", "", q.n + ".")); h.appendChild(document.createTextNode(q.q)); card.appendChild(h);
    const order = perm(q.id, q.o.length, q.ns);
    order.forEach((raw, pos) => {
      const b = el("button", "opt"); b.appendChild(el("b", "", L[pos] + ")")); b.appendChild(document.createTextNode(q.o[raw]));
      if (done) {
        b.disabled = true;
        if (raw === q.a) b.classList.add("correct"); else if (raw === c) b.classList.add("wrong");
      } else b.onclick = () => { st.ans[q.id] = raw; persist(); render(); };
      card.appendChild(b);
    });
    if (done) {
      const cp = order.indexOf(q.a);
      const m = el("div", "msg " + (c === q.a ? "good" : "bad"),
        (c === q.a ? "Correct. " : "Wrong. ") + "The correct answer is " + L[cp] + ") " + q.o[q.a]);
      card.appendChild(m);
      if (q.l) {
        const lr = el("div", "learn"); const p = el("p"); p.appendChild(el("strong", "", "Key point: ")); p.appendChild(document.createTextNode(q.l)); lr.appendChild(p);
        const sv = el("button", "save", st.saved[q.id] ? "Saved to notes" : "Save to notes"); sv.setAttribute("aria-pressed", !!st.saved[q.id]);
        sv.onclick = () => { if (st.saved[q.id]) delete st.saved[q.id]; else st.saved[q.id] = 1; persist(); sv.textContent = st.saved[q.id] ? "Saved to notes" : "Save to notes"; sv.setAttribute("aria-pressed", !!st.saved[q.id]); };
        lr.appendChild(sv); card.appendChild(lr);
      }
    }
    v.appendChild(card);
  });
  if (!shown) v.appendChild(el("div", "empty", "No questions match this filter."));
  const s = tabStats(tab);
  if (s.ans === s.tot) {
    const d = el("div", "box done", "Finished. You scored " + s.ok + " out of " + s.tot + " (" + Math.round(s.ok / s.tot * 100) + "%).");
    v.appendChild(d);
  }
}

function renderNotes(v) {
  const jump = el("div", "bar");
  Object.keys(TOPICS).forEach(k => { const c = el("button", "chip", TOPICS[k]); c.onclick = () => { const e = document.getElementById("n-" + k); if (e) e.scrollIntoView({ behavior: "smooth", block: "start" }); }; jump.appendChild(c); });
  v.appendChild(jump);
  const nb = el("div"); nb.innerHTML = NOTES; v.appendChild(nb);

  const sb = el("div", "box"); sb.appendChild(el("h3", "", "Saved key points"));
  const ids = Object.keys(st.saved);
  if (!ids.length) sb.appendChild(el("div", "empty", "Answer a question and tap ‘Save to notes’ to collect key points here."));
  ids.forEach(id => {
    const [k, i] = id.split(":"); const q = ITEMS[k] && ITEMS[k][+i]; if (!q) return;
    const row = el("div", "sv"); row.appendChild(el("small", "", (q.t ? TOPICS[q.t] : "") + " · " + q.q));
    row.appendChild(document.createTextNode(q.l));
    const rm = el("button", "rm", "Remove"); rm.onclick = () => { delete st.saved[id]; persist(); render(); };
    row.appendChild(el("br")); row.appendChild(rm); sb.appendChild(row);
  });
  v.appendChild(sb);

  const mb = el("div", "box"); mb.appendChild(el("h3", "", "My notes"));
  const ta = document.createElement("textarea"); ta.id = "myNotes"; ta.placeholder = "Type your own notes here. They save automatically in this browser.";
  ta.value = st.notes || ""; ta.oninput = () => { st.notes = ta.value; persist(); };
  mb.appendChild(ta); v.appendChild(mb);
}

render();
})();
</script>
