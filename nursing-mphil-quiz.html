<template id="notesTpl"><section class="note" id="n-LR"><h3>Literature review and frameworks <small>Group 1</small></h3>
<ul>
<li>A literature review is a <mark>critical synthesis</mark> of existing knowledge. In qualitative research it is <mark>iterative, flexible and inductive</mark>: done before, during and after data collection.</li>
<li>Qualitative reviews are <mark>less exhaustive</mark> than quantitative ones (landmark studies and recent writing). Quantitative reviews are exhaustive, systematic, deductive and confirmatory.</li>
<li><mark>Deductive</mark>: theory → hypothesis → test with data. <mark>Inductive</mark>: data → patterns → theory.</li>
<li><mark>Theoretical framework</mark> = built from an existing formal theory (Watson, Roy, Meleis). <mark>Conceptual framework</mark> = built by the researcher, often a diagram, when no theory fits.</li>
<li>Justify a framework by: relevance, alignment with objectives, support from earlier studies, power to explain or predict, fit with population and setting, guidance for data work, strengths.</li>
<li>Health Belief Model constructs: <mark>susceptibility, severity, benefits, barriers, cues to action, self-efficacy</mark>.</li>
<li>Framework types: phenomenological (lived experience), grounded theory (new theory from data), ethnographic (shared culture), grand/middle-range nursing theories.</li>
<li>Search: <mark>AND narrows, OR broadens, NOT excludes</mark>, quotation marks for phrases, <mark>*</mark> for truncation. Databases: CINAHL (nursing), PubMed/MEDLINE, PsycINFO, EMBASE, Scopus, Web of Science, Cochrane.</li>
<li>Organise by <mark>theme</mark>, not study by study. Funnel: broad → narrow → gap. Appraise with <mark>CASP</mark>. Use a synthesis matrix.</li>
<li>Synthesis types: thematic, narrative, <mark>meta-ethnography</mark> (translates concepts across studies), framework synthesis, meta-synthesis, critical interpretive synthesis.</li>
<li>Biggest mistake: a <mark>one-paragraph-per-study list</mark> with no integration.</li>
</ul></section>

<section class="note" id="n-SAMP"><h3>Setting, recruitment, population and sampling <small>Group 2</small></h3>
<ul>
<li><mark>Study setting</mark> = the natural environment where participants live the phenomenon. Ethnography → community; case study → one institution; phenomenology → where the experience occurs; narrative → personal environments.</li>
<li>Recruitment: use <mark>multiple channels</mark>, flexible plans, gatekeepers, relationships built before recruitment; monitor and adapt.</li>
<li>Recruitment ethics: informed consent, confidentiality, rapport, sensitivity, <mark>right to withdraw</mark>.</li>
<li>Challenges: small samples, need for information-rich cases, access barriers, reluctance, time and resources.</li>
<li><mark>Target population</mark> = people with the relevant experience. Emphasis is on rich insight, <mark>not representativeness</mark>.</li>
<li>Qualitative sampling is purpose-driven, information-rich, <mark>non-probability</mark>, depth over breadth, flexible, guided by <mark>saturation</mark>.</li>
<li><mark>Purposive</mark> is the most common type. Types include maximum variation, homogeneous, extreme/deviant, typical, critical, criterion, theory-based, opportunistic, snowball, convenience.</li>
<li><mark>Snowball</mark> = participants refer others (hidden populations). <mark>Quota</mark> = fill predetermined categories.</li>
<li><mark>Information power</mark>: narrower aim, specific sample, strong theory and dialogue → smaller sample needed.</li>
</ul></section>

<section class="note" id="n-DATA"><h3>Primary and secondary data <small>Group 4</small></h3>
<ul>
<li>Qualitative data are <mark>non-numerical, rich, contextual, interpretive, flexible</mark>.</li>
<li><mark>Primary</mark>: collected directly by the researcher for this study (interviews, focus groups, observation).</li>
<li>Interviews: structured, semi-structured, unstructured. Strengths: depth and probing. Limits: time, interviewer influence, transcription.</li>
<li>Focus group: <mark>at least six</mark> participants plus a moderator. Limits: dominant voices, confidentiality cannot be guaranteed.</li>
<li>Observation: participant, non-participant, structured, unstructured. Output: field notes. Risk: participants change behaviour.</li>
<li><mark>Secondary</mark>: collected earlier for another purpose. Classes: documentary sources, archived research data, digital/online sources, institutional records.</li>
<li>Secondary: cheap and fast but <mark>low control</mark>, possible data mismatch, missing context, original participants cannot clarify.</li>
<li>Ethics of reuse: was it ethically collected, did consent cover reuse, can people be identified, is it genuinely public, copyright and ownership. <mark>Public does not mean anonymous.</mark></li>
</ul></section>

<section class="note" id="n-ETH"><h3>Ethics in qualitative inquiry <small>Groups 5 and 4</small></h3>
<ul>
<li>Qualitative research is <mark>relational</mark>; the researcher is the primary instrument.</li>
<li><mark>Belmont (1979)</mark>: respect for persons, beneficence, justice. It followed the Tuskegee study.</li>
<li>Informed consent = <mark>information + understanding + voluntariness</mark>. It is an ongoing process.</li>
<li>Five practical pillars: consent, confidentiality, anonymity, no-harm (non-maleficence), reciprocity.</li>
<li>History: <mark>Nuremberg 1947 → Helsinki 1964 (latest revision 2024) → Belmont 1979</mark>. ICN Code of Ethics for Nurses revised 2021 (four elements: people, practice, profession, global health).</li>
<li>Helsinki 2024: vulnerability is <mark>contextual and dynamic</mark>, not a fixed list.</li>
<li>IRB/REC functions: ethical, administrative and scientific review. In Ghana: CHS-EPRC (University of Ghana) and GHS-ERC; dual approval possible. <mark>No data collection before written approval.</mark></li>
<li>Ghanaian REC challenges: few bioethicists, limited funding, no national authority, weak post-approval monitoring.</li>
<li>Special populations: simplified consent, ongoing right to withdraw, psychological support, respectful language, community engagement from design, sharing findings back. Avoid <mark>research fatigue</mark>.</li>
<li>Data security: password protection, limited access, encryption, retention and destruction rules, pseudonyms, caution with cloud and AI tools.</li>
</ul></section>

<section class="note" id="n-RIG"><h3>Methodological rigour <small>Group 6</small></h3>
<ul>
<li>Rigour = systematic, transparent, disciplined use of methods to ensure <mark>trustworthiness</mark>.</li>
<li>Lincoln &amp; Guba: <mark>Credibility (validity), Transferability (generalisability), Dependability (reliability), Confirmability (objectivity)</mark>.</li>
<li>Credibility: prolonged engagement, persistent observation, triangulation, member checking, peer debriefing, negative case analysis.</li>
<li>Transferability: thick description. Dependability: audit trail and external audit. Confirmability: quotes and declared researcher role.</li>
<li>Denzin’s triangulation: <mark>methods, data sources, investigators, theory</mark>.</li>
<li>Spradley’s nine dimensions for field notes: space, actors, activities, objects, acts, events, time, goals, feelings.</li>
<li>Reflexivity: personal, interpersonal, methodological, contextual. Tools: reflexive journal, positionality statement.</li>
<li><mark>NVivo and ATLAS.ti support analysis; they do not replace judgement.</mark></li>
<li>Reporting guides: <mark>COREQ = 32 items</mark> (interviews and focus groups); <mark>SRQR = 21 items</mark> (broad qualitative).</li>
<li>Criticisms: criteria are “parallel” to quantitative ones; one set may not fit all methods; member checking and saturation are questioned. Tracy’s eight “big-tent” criteria are an alternative.</li>
</ul></section>

<section class="note" id="n-TECH"><h3>Techniques, data management, protection and software <small>Group 7</small></h3>
<ul>
<li>Qualitative research asks <mark>how and why</mark>, not how many.</li>
<li>Techniques: in-depth interviews, focus groups, observation, case studies, document analysis.</li>
<li>A <mark>data management plan</mark> is written before collection: storage, security, backup, anonymisation, access, retention, sharing, destruction.</li>
<li>Storage: physical, electronic, cloud, backup. <mark>Never rely on one location.</mark></li>
<li>Data protection = legal, organisational and technical measures (Ghana: Data Protection Act 2012, <mark>Act 843</mark>). Encryption = plaintext → ciphertext; it is one tool within data protection.</li>
<li><mark>Symmetric</mark> encryption = one key (AES). <mark>Asymmetric</mark> = public + private key (RSA, ECC).</li>
<li>Software: <mark>NVivo, ATLAS.ti, MAXQDA</mark> for qualitative; SPSS is quantitative. MAXQDA workspaces: Document System, Code System, Retrieved Segments, Text Browser.</li>
<li>NVivo challenges: cost, training, learning curve. MAXQDA challenges: data overload, decontextualisation, coding reliability.</li>
</ul></section>

<section class="note" id="n-FIND"><h3>Findings and discussion <small>Group 8</small></h3>
<ul>
<li>A qualitative finding is an <mark>interpretive product</mark> of systematic, reflexive analysis: themes, categories, metaphors, models.</li>
<li>Findings are <mark>subjective, contextualised and flexible</mark>; they answer the research questions and use direct quotes.</li>
<li>Discussion follows results and comes before conclusions. Three steps: <mark>interpretation, analysis, explanation</mark>.</li>
<li>Include: key findings with evidence, comparison with earlier studies, strengths, unexpected findings, limitations, implications, future research.</li>
<li>Errors: substituting a summary for discussion, repeating data, justifying by practical use alone, <mark>apologetic tone</mark>, imagining what if no errors.</li>
<li>Language: confirm (“consistent with…”), contradict (“in contrast to earlier findings…”), explain (“a possible explanation…”), suggest (“these findings suggest…”).</li>
</ul></section>

<section class="note" id="n-CONC"><h3>Concluding chapter <small>Group 9</small></h3>
<ul>
<li>Order: <mark>Summary → Findings → Conclusions → Implications → Recommendations → Limitations → Further research</mark> (S-F-C-I-R-L-F).</li>
<li>Summary of the study: <mark>AIM-F</mark> = Aim, Investigation/Method, Main findings, Final conclusion. Keep it selective; add nothing new.</li>
<li><mark>Conclusion</mark> = what can reasonably be concluded; clear, concise, evidence-based, tied to objectives.</li>
<li><mark>Implication</mark> = what the findings mean and why they matter (knowledge, practice, education, administration, policy, research).</li>
<li><mark>Recommendation</mark> = realistic, evidence-informed action for a stakeholder who can act. Do not jump from an isolated finding to an action.</li>
<li><mark>Limitation</mark> → potential effect → boundary of interpretation. Qualitative focus: researcher influence, context, transferability, reflexivity, coherence (data → analysis → interpretation → findings).</li>
<li>A small sample is not automatically a weakness; judge it against design, purpose and setting.</li>
</ul></section>

<section class="note" id="n-REP"><h3>Reporting and dissemination <small>Group 10</small></h3>
<ul>
<li>Pathway: <mark>Research → Report → Disseminate → Translate → Use → Impact</mark>. Dissemination bridges the <mark>know-do gap</mark>.</li>
<li>Guidelines: <mark>COREQ/SRQR</mark> (qualitative), CONSORT (RCT), STROBE (observational), PRISMA (systematic reviews), CARE (case reports), SPIRIT/PRISMA-P (protocols), SQUIRE (quality improvement), STARD (diagnostic accuracy).</li>
<li>Thesis: Ch1 Introduction; Ch2 Literature review; Ch3 Methodology; Ch4 Findings; Ch5 Discussion and conclusion.</li>
<li>Manuscript: choose the journal early, follow its guide, use the checklist, write a cover letter. Authorship needs <mark>intellectual contribution + drafting + approval + accountability</mark>.</li>
<li>Dissemination: passive (papers, talks), targeted (policy briefs, workshops), active KT (photovoice, arts-based, town halls). Steps: audience → message → channel → evaluate.</li>
<li>Media: plain language, 2–3 key messages, protect identity, state limits, <mark>inverted pyramid</mark>.</li>
<li>Plagiarism = using others’ words or ideas without credit. <mark>Fabrication</mark> = inventing data. <mark>Falsification</mark> = manipulating or omitting data. Similarity software does not decide.</li>
<li>APA 7th: (Author, Year); two authors with &amp;; <mark>three or more = et al.</mark>; reference list alphabetical with hanging indent.</li>
</ul></section>

n fatigue returns only records containing both."},{"t":"LR","q":"The asterisk (*) in a database search is used for:","o":["Truncation to capture word variations","Phrase searching","Excluding a term","Combining concepts"],"a":0,"l":"Truncation example: nurs* finds nurse, nurses, nursing."},{"t":"LR","q":"The first step in a systematic database search is to:","o":["Formulate a clear and focused research question","Choose the journals to cite","Write the discussion chapter","Run a statistical test"],"a":0,"l":"Then identify key concepts, develop keywords and synonyms, select databases and search systematically."},{"t":"LR","q":"Which tool is named for critical appraisal of qualitative studies in the Group 1 presentation?","o":["CASP (Critical Appraisal Skills Programme)","SPSS","PRISMA","NVivo"],"a":0,"l":"CASP is used when screening and appraising each study during organisation of the review."},{"t":"LR","q":"The most common weakness in student literature reviews is:","o":["One paragraph per study with no integration or synthesis","Using too many databases","Writing too many themes","Including a research gap"],"a":0,"l":"Synthesise, don’t summarise: compare, find patterns, evaluate, and end each section with a synthesis statement."},{"t":"SAMP","q":"In qualitative research, the study setting is best defined as:","o":["The natural environment in which participants experience the phenomenon","A controlled laboratory environment","The sampling frame used for random selection","The list of data-analysis software"],"a":0,"l":"Lim (2024); Korstjens & Moser (2017): meanings and behaviours are shaped by context."},{"t":"SAMP","q":"A study of the culture of fisherfolk in a coastal community is an example of which approach and setting?","o":["Ethnography in fishing communities","Case study in a university","Phenomenology in hospitals","Narrative inquiry in lecturers’ homes"],"a":0,"l":"Each approach has a typical setting: ethnography → community, case study → one institution, phenomenology → where the experience occurs."},{"t":"SAMP","q":"Investigating leadership practices in one university is an example of:","o":["A case study","Ethnography","Grounded theory","Phenomenology"],"a":0,"l":"The setting for the case study is the selected university."},{"t":"SAMP","q":"Exploring nurses’ experience of workplace stress in hospitals is an example of:","o":["Phenomenology","Case study","Narrative inquiry","Ethnography"],"a":0,"l":"Phenomenology studies a lived experience in the setting where it happens."},{"t":"SAMP","q":"Examining how small business owners adapt to economic shocks is an example of:","o":["Grounded theory","Phenomenology","Ethnography","Case study"],"a":0,"l":"Grounded theory builds a process/explanatory theory from data."},{"t":"SAMP","q":"Understanding the career journeys of university lecturers is an example of:","o":["Narrative inquiry","Grounded theory","Phenomenology","Case study"],"a":0,"l":"Narrative inquiry uses participants’ stories in their personal environments."},{"t":"SAMP","q":"Recruitment in qualitative research is:","o":["Identifying potential participants and giving them information to establish interest in joining","Randomly assigning participants to groups","Calculating the sample size by formula","Destroying data after the study"],"a":0,"l":"Manohar et al. (2018): inappropriate recruitment can significantly affect findings."},{"t":"SAMP","q":"Which is a recommended recruitment strategy?","o":["Use multiple recruitment channels and flexible plans","Rely on a single approach only","Begin building relationships after recruitment ends","Keep the recruitment plan rigid"],"a":0,"l":"Negrin et al. (2022): use gatekeepers, snowballing, community referrals, and monitor and adapt continuously."},{"t":"SAMP","q":"Which is NOT an ethical consideration listed for recruitment?","o":["Offering large cash rewards to guarantee participation","Informed consent","Confidentiality and anonymity","Right to withdraw"],"a":0,"l":"Others listed: rapport building and sensitivity to the topic."},{"t":"SAMP","q":"Which is a recruitment challenge identified in the slides?","o":["Access barriers such as lengthy approval processes","Having too many information-rich cases","Participants being too eager to share sensitive data","Excessive funding"],"a":0,"l":"Also: small samples, need for information-rich cases, participant reluctance, time and resource demands."},{"t":"SAMP","q":"In qualitative research the target population is:","o":["The group possessing experiences, characteristics or knowledge relevant to the phenomenon","A large statistically representative group","All the people in the country","The list of the researcher’s colleagues"],"a":0,"l":"Unlike quantitative research, emphasis is not on representativeness but on rich insights."},{"t":"SAMP","q":"Which is a key characteristic of a qualitative target population?","o":["Often relatively small and specific","Large and statistically representative","Selected at random from a register","Chosen to match national census figures"],"a":0,"l":"Defined by shared experience and selected for information-rich data."},{"t":"SAMP","q":"Sampling in qualitative research aims at:","o":["Depth of understanding rather than statistical representativeness","Statistical generalisation","Equal probability of selection","Maximising sample size"],"a":0,"l":"Wutich et al. (2024)."},{"t":"SAMP","q":"Which is a characteristic of qualitative sampling?","o":["Non-probability based and purpose-driven","Probability based and random","Fixed and decided once","Guided by power calculations only"],"a":0,"l":"Others: information-rich, depth over breadth, flexible and iterative, guided by saturation."},{"t":"SAMP","q":"The most commonly used sampling strategy in qualitative research is:","o":["Purposive sampling","Simple random sampling","Quota sampling","Systematic sampling"],"a":0,"l":"Participants are deliberately chosen for relevant experience, knowledge or characteristics."},{"t":"SAMP","q":"Snowball sampling is especially useful for:","o":["Hidden or hard-to-reach populations","Large national surveys","Random selection from a register","Laboratory experiments"],"a":0,"l":"Current participants recruit or recommend further eligible participants."},{"t":"SAMP","q":"Quota sampling involves:","o":["Recruiting until predetermined categories or quotas are filled","Participants recruiting their friends","Selecting extreme or unusual cases","Selecting by lottery"],"a":0,"l":"It is listed separately from purposive and snowball sampling."},{"t":"SAMP","q":"Which of the following is a type of purposive sampling?","o":["Maximum variation","Simple random","Cluster random","Systematic random"],"a":0,"l":"Other purposive types: extreme case, deviant case, typical case, homogeneous, intensity, critical case, criterion, theory-based, opportunistic."},{"t":"SAMP","q":"Saturation is reached when:","o":["Further data produce no new codes, themes or theoretical insight","The target sample size is fixed in advance","All participants have been interviewed twice","The analysis software stops working"],"a":0,"l":"Sampling often continues until no new themes emerge."},{"t":"SAMP","q":"Maximum variation sampling is used to:","o":["Capture diverse patterns across participants","Detail one specific subgroup","Study only extreme outliers","Recruit through friends"],"a":0,"l":"Homogeneous sampling, by contrast, details a specific subgroup (Merriam & Tisdell, 2016)."},{"t":"SAMP","q":"Homogeneous sampling is used to:","o":["Detail a specific subgroup","Capture diverse patterns","Select cases at random","Fill quotas"],"a":0,"l":"Sampling intent dictates technique."},{"t":"SAMP","q":"Transparency in sampling requires:","o":["Pre-defined inclusion and exclusion criteria","Choosing whoever is available","Hiding the criteria to avoid bias","Using the largest sample possible"],"a":0,"l":"This avoids convenience sampling and supports transferability."},{"t":"SAMP","q":"The ‘information power’ framework (Malterud et al., 2016) is:","o":["A dynamic alternative to saturation for deciding sample size","A software package for coding","A reporting checklist","An ethics code"],"a":0,"l":"Sample size depends on aim narrowness, sample specificity, theory use, dialogue quality and analysis strategy."},{"t":"SAMP","q":"According to the information power framework, a narrower study aim generally means:","o":["A smaller sample is needed","A larger sample is needed","No sample is needed","Random sampling must be used"],"a":0,"l":"Narrow aim, specific sample, established theory and strong dialogue all reduce the sample needed."},{"t":"SAMP","q":"Which is a reason sampling matters in qualitative research?","o":["It improves data quality and richness and facilitates saturation","It guarantees statistical generalisation","It removes the need for ethics approval","It makes member checking unnecessary"],"a":0,"l":"Also enhances trustworthiness and credibility."},{"t":"SAMP","q":"Why is defining the target population important?","o":["It guides recruitment and informs sampling decisions","It determines the p-value","It replaces informed consent","It fixes the number of themes"],"a":0,"l":"It also ensures selection of information-rich cases and enhances credibility."},{"t":"SAMP","q":"Which statement about gatekeepers is correct?","o":["They can help the researcher access participants and sites","They analyse the data for the researcher","They sign the findings as co-authors","They replace the ethics committee"],"a":0,"l":"Leveraging gatekeepers and trusted intermediaries is a recommended recruitment strategy."},{"t":"SAMP","q":"Which statement about qualitative sample size is correct?","o":["A small sample is not automatically inadequate; it must fit the design and purpose","A sample below 100 is always inadequate","Sample size must match population proportions","Sample size is set by a power calculation"],"a":0,"l":"Group 9: judge the sample against design, purpose, analysis, research question and setting."},{"t":"SAMP","q":"Recruitment ‘time and resource demands’ arise because recruitment often requires:","o":["Prolonged engagement and relationship building","Mailing thousands of questionnaires","Expensive laboratory equipment","Randomisation software"],"a":0,"l":"Bekteshi et al. (2024)."},{"t":"DATA","q":"In qualitative research, data refers to:","o":["Non-numerical information collected to understand experiences, perceptions, meanings, behaviours and context","Only numerical measurements from instruments","Statistical test results","Only published literature"],"a":0,"l":"Çelik et al. (2020)."},{"t":"DATA","q":"Which is NOT a characteristic of qualitative data?","o":["Numerical and precise","Rich and detailed","Contextual","Interpretive"],"a":0,"l":"Olson (2021): non-numerical, rich and detailed, contextual, interpretive, flexible and evolving."},{"t":"DATA","q":"Primary data are:","o":["Original information collected directly by the researcher for the current question","Data collected earlier for another purpose","Data taken from government publications","Data obtained from archived transcripts"],"a":0,"l":"They come from interviews, focus groups, observation and similar methods."},{"t":"DATA","q":"A key characteristic of primary data is that they:","o":["Allow the researcher to ask follow-up questions and explore emerging issues","Cannot be clarified with participants","Are always cheaper than secondary data","Are always numerical"],"a":0,"l":"Primary data are common in phenomenology, ethnography, case studies and grounded theory."},{"t":"DATA","q":"Interviews in qualitative research can be:","o":["Structured, semi-structured or unstructured","Only structured","Only unstructured","Only conducted in groups"],"a":0,"l":"Interviews are among the most widely used qualitative approaches."},{"t":"DATA","q":"Which is a limitation of interviews?","o":["They can be time-consuming and the interviewer may influence responses","They cannot capture personal experiences","They give shallow information","They never allow probing"],"a":0,"l":"Interviews need skilled interviewing and transcription."},{"t":"DATA","q":"A focus group discussion (FGD) involves:","o":["A directed discussion with a small group of participants sharing relevant characteristics, plus a moderator","A single participant and an interviewer","A large survey of hundreds of respondents","Covert observation of a crowd"],"a":0,"l":"The slides state at least six participants."},{"t":"DATA","q":"A limitation of focus groups is that:","o":["Dominant participants may influence the discussion","They cannot generate diverse viewpoints","They are unsuitable for exploring attitudes","Confidentiality among participants is guaranteed"],"a":0,"l":"Confidentiality among group members cannot be completely guaranteed."},{"t":"DATA","q":"Focus groups are efficient for:","o":["Exploring attitudes, beliefs and experiences through interaction","Estimating prevalence","Testing hypotheses statistically","Measuring blood pressure"],"a":0,"l":"Participants build on each other’s ideas using a discussion guide."},{"t":"DATA","q":"Which is NOT a type of observation named in the slides?","o":["Randomised observation","Participant observation","Non-participant observation","Structured observation"],"a":0,"l":"Unstructured observation is also listed."},{"t":"DATA","q":"Observation data can be generated through:","o":["Field notes, descriptions of behaviour and interactions between participants","Only questionnaires","Only laboratory tests","Only transcripts of secondary sources"],"a":0,"l":"Observation provides context participants may not mention in interviews (Vaismoradi et al., 2021)."},{"t":"DATA","q":"A challenge of primary data collection is that:","o":["Participants may change their behaviour because they are being observed","Data are never relevant to the question","The researcher has no control over the process","Data cannot be clarified"],"a":0,"l":"Others: time and resource demands, difficult recruitment, researcher bias, ethical approval and consent."},{"t":"DATA","q":"Which practices are recommended throughout primary data collection?","o":["Reflexivity, appropriate sampling, careful documentation and ethical procedures","Speed, large samples, random assignment and blinding","Anonymity only","Avoiding field notes"],"a":0,"l":"Creswell & Creswell (2023)."},{"t":"DATA","q":"Secondary data are:","o":["Data collected or produced earlier for another purpose, then used for a new question","Original data collected directly by the researcher","Data produced only by participants’ diaries in the current study","Data that cannot be reused"],"a":0,"l":"Examples: existing transcripts, reports, government publications, organisational records."},{"t":"DATA","q":"Which is an example of secondary qualitative data?","o":["Archived interview transcripts","A new focus group","Observation done by the researcher today","A fresh semi-structured interview"],"a":0,"l":"Others: diaries and letters, historical documents, published qualitative studies, archived datasets."},{"t":"DATA","q":"Hospital records and school records are classified as:","o":["Institutional records","Documentary sources","Digital and online sources","Archived research data"],"a":0,"l":"Other classes: documentary sources, archived research data, and digital/online sources."},{"t":"DATA","q":"Websites, blogs, online forums and social media posts are classified as:","o":["Digital and online sources","Institutional records","Archived research data","Documentary sources"],"a":0,"l":"Publicly available interviews also belong here."},{"t":"DATA","q":"Interview transcripts, focus group transcripts, field notes and audio/video records that were stored earlier are:","o":["Archived research data","Documentary sources","Institutional records","Primary data"],"a":0,"l":"They were collected for another study but are available for reuse."},{"t":"DATA","q":"Which t observation notes made today","Documentary sources","Archived research data","Institutional records"],"a":0,"l":"The four are documentary, archived research data, digital/online sources and institutional records."},{"t":"DATA","q":"Using secondary data can ‘support new interpretations’ and:","o":["Increase the value of existing datasets","Remove the need for any analysis","Guarantee representativeness","Eliminate bias"],"a":0,"l":"Sharp & Munly (2022)."},{"t":"ETH","q":"Qualitative research needs special ethical attention mainly because it is:","o":["Relational and often involves sensitive disclosure over sustained interaction","Always done on large samples","Always anonymous by design","Based only on numbers"],"a":0,"l":"The researcher is the ‘primary instrument’, so ethical conduct is inseparable from the person (Halai, 2006)."},{"t":"ETH","q":"The Belmont Report (1979) established which three principles?","o":["Respect for persons, beneficence and justice","Autonomy, privacy and anonymity","Consent, confidentiality and reciprocity","Honesty, integrity and accountability"],"a":0,"l":"It followed the Tuskegee Syphilis Study scandal."},{"t":"ETH","q":"Which Belmont principle says ‘no group should be repeatedly selected simply because they are convenient or powerless to refuse’?","o":["Justice","Beneficence","Respect for persons","Non-maleficence"],"a":0,"l":"Justice = fair distribution of the burdens and benefits of research."},{"t":"ETH","q":"Respect for persons requires that:","o":["Autonomous choices be respected and those with diminished autonomy get extra protection","Participants be paid","Researchers remain detached","All data be published"],"a":0,"l":"Children and persons with cognitive impairment need additional protection."},{"t":"ETH","q":"Beneficence in the slides is summarised as:","o":["Maximise possible benefits and minimise possible harms","Distribute burdens fairly","Respect autonomy","Maintain anonymity"],"a":0,"l":"It requires a formal risk/benefit assessment before the study begins."},{"t":"ETH","q":"Which is NOT one of the three necessary components of informed consent?","o":["Payment","Information","Understanding","Voluntariness"],"a":0,"l":"Understanding means comprehension, not just literacy."},{"t":"ETH","q":"Consent is best treated as:","o":["An ongoing process","A one-time signature","Only needed for children","Needed only for focus groups"],"a":0,"l":"Creswell & Creswell (2023)."},{"t":"ETH","q":"The key difference between confidentiality and anonymity is that:","o":["Confidentiality means the researcher knows identities but protects them; anonymity means identities are not known","They are the same thing","Anonymity means the researcher shares the identities","Confidentiality means identities are published"],"a":0,"l":"In qualitative interviews true anonymity is hard because the researcher meets participants."},{"t":"ETH","q":"Non-maleficence means avoiding:","o":["Distress, embarrassment, stigmatisation or re-traumatisation","Using open-ended questions","Writing field notes","Using a sampling frame"],"a":0,"l":"The ethical pillars: consent, confidentiality, anonymity, no-harm and reciprocity (Halai, 2006)."},{"t":"ETH","q":"Reciprocity in qualitative research means:","o":["Considering what, if anything, should be given back to participants","Paying participants for their answers","Asking participants to recruit others","Sharing identities with the community"],"a":0,"l":"Participants give time, trust and personal disclosure."},{"t":"ETH","q":"A trauma-informed approach means:","o":["Designing the whole research process to avoid re-traumatising participants","Interviewing only trauma survivors","Avoiding any sensitive topic","Using only observation"],"a":0,"l":"Mestre-Martínez (2025)."},{"t":"ETH","q":"Vicarious trauma refers to:","o":["Researcher distress from repeated exposure to participants’ traumatic experiences","Trauma directly experienced by the participant","Trauma of a whole community"," voluntariness and comprehension"],"a":0,"l":"Nurses acting as researchers are expected to follow it."},{"t":"ETH","q":"Which committee reviews research from College of Health Sciences students and faculty at the University of Ghana?","o":["CHS Ethical and Protocol Review Committee (EPRC)","Ghana Health Service Ethics Review Committee only","National Ethics Authority","ICN committee"],"a":0,"l":"The GHS-ERC reviews research in Ghana Health Service facilities; dual approval may be needed."},{"t":"ETH","q":"An IRB / REC is:","o":["A committee that reviews and approves or rejects protocols before data collection","A body that analyses the data","A professional association of nurses","A journal editorial board"],"a":0,"l":"Names vary: IRB, REC, EPRC (Kim, 2012)."},{"t":"ETH","q":"Which is one of the three review functions of an IRB?","o":["Scientific/peer review","Statistical review only","Financial audit","Marketing review"],"a":0,"l":"The three: ethical, administrative and scientific/peer review."},{"t":"ETH","q":"A documented weakness of IRB systems is:","o":["Committees may be overloaded and understaffed","They never review consent forms","They have unlimited expertise","They have no conflicts of interest"],"a":0,"l":"Also: delays in multi-site studies and excessive time on consent wording."},{"t":"ETH","q":"According to Owusu et al. (2022), a challenge facing Ghanaian RECs is:","o":["Weak post-approval monitoring","Too many bioethicists","No diversity of members","Excess funding"],"a":0,"l":"Also: limited funding and no single national ethics regulatory authority."},{"t":"ETH","q":"Data collection may begin only after:","o":["Formal written ethical approval is received","The consent form is drafted","The proposal is submitted","Participants are identified"],"a":0,"l":"Adverse events and protocol deviations must also be reported promptly."},{"t":"ETH","q":"Which is a safeguard for special/key populations?","o":["Enhanced, simplified consent and available psychological support referral","Removing the right to withdraw after data are collected","Using clinical, pathologising language","Engaging the community only at recruitment"],"a":0,"l":"Also: community engagement from design, sharing findings back, justifying why the research is needed."},{"t":"ETH","q":"‘Research fatigue’ refers to:","o":["Small or frequently studied communities becoming tired of repeated studies","Researchers being tired after fieldwork","Participants forgetting the study","Fatigue of review committees"],"a":0,"l":"Avoid redundant and exploitative research; ensure new knowledge or benefit."},{"t":"ETH","q":"In data security for qualitative data, researchers should:","o":["Use password-protected storage and limit access to identifiable data","Store transcripts on shared public drives","Keep identifiers with the transcripts","Never delete data"],"a":0,"l":"Also encrypt sensitive files and set retention and destruction procedures."},{"t":"ETH","q":"Protecting identity in reporting includes:","o":["Using pseudonyms or participant codes","Publishing full names","Using quotations that reveal the location","Sharing audio files freely"],"a":0,"l":"Also avoid identifying quotations and explain the limits of confidentiality."},{"t":"ETH","q":"Researcher integrity includes avoiding:","o":["Fabrication, falsification and plagiarism","Open-ended questions","Reflexivity","Purposive sampling"],"a":0,"l":"Researchers should also represent participants’ accounts accurately and acknowledge limitations."},{"t":"ETH","q":"Why might traditional ethics codes not fit qualitative research well?","o":["They were designed for clinical models with fixed hypotheses and predictable risks","They ban interviews","They apply only to children","They require random sampling"],"a":0,"l":"Qualitative designs are emergent and evolving (Halai, 2006)."},{"t":"ETH","q":"In Ghana, the Data Protection Act of 2012 is:","o":["Act 843","Act 29","Act 480","Act 703"],"a":0,"l":"It provides the legal framework for protecting personal data."},{"t":"RIG","q":"Methodological rigour in qualitative research is:","o":["The systematic, transparent and disciplined application of methods to ensure quality and trustworthiness","Reliance on statistical significance","Using the largest sample possible","Avoiding any researcher involvement"],"a":0,"l":"Stenfors et al. (2020); Lincoln & Guba (1985)."},{"t":"RIG","q":"Which four criteria make up Lincoln & Guba’s trustworthiness framework?","o":["Credibility, transferability, dependability, confirmability","Validity, reliability, objectivity, generalisability","Respect, beneficence, justice, autonomy","Consent, privacy, anonymity, reciprocity"],"a":0,"l":"They are the qualitative answer to validity and reliability in quantitative research."},{"t":"RIG","q":"Credibility corresponds to which quantitative concept?","o":["Validity","Reliability","Generalisability","Objectivity"],"a":0,"l":"Credibility = whether findings give a plausible, accurate picture of participants’ experience."},{"t":"RIG","q":"Transferability corresponds to which quantitative concept?","o":["Generalisability","Validity","Reliability","Objectivity"],"a":0,"l":"The reader judges whether the findings fit their own context, helped by thick description."},{"t":"RIG","q":"Dependability corresponds to which quantitative concept?","o":["Reliability","Validity","Generalisability","Objectivity"],"a":0,"l":"Dependability = a logical, traceable and consistent research process."},{"t":"RIG","q":"Confirmability corresponds to which quantitative concept?","o":["Objectivity","Reliability","Validity","Generalisability"],"a":0,"l":"Findings should reflect participants’ accounts rather than researcher bias."},{"t":"RIG","q":"Which strategy mainly supports credibility?","o":["Prolonged engagement, triangulation and member checking","Audit trail only","Statistical power","Random assignment"],"a":0,"l":"Also persistent observation, peer debriefing and negative case analysis."},{"t":"RIG","q":"Which strategy mainly supports transferability?","o":["Thick description of context, participants and setting","Inquiry audit","Reflexive journal only","Random sampling"],"a":0,"l":"Clear detail on sample size, characteristics, methods and timeframe also helps."},{"t":"RIG","q":"Which strategy mainly supports dependability?","o":["Audit trail and external inquiry audit","Thick description","Member checking","Purposive sampling"],"a":0,"l":"An audit trail records sampling, coding and theme decisions."},{"t":"RIG","q":"Which strategy mainly supports confirmability?","o":["Participant quotes and explicit acknowledgement of the researcher’s background and role","Increasing the sample","Random sampling","Statistical testing"],"a":0,"l":"Details of data collection also help."},{"t":"RIG","q":"Prolonged engagement means:","o":["Spending sufficient time in the field to learn context, build rapport and detect misinformation","Interviewing each participant many times","Reading the literature for months","Staying in the field after data saturation"],"a":0,"l":"Lincoln & Guba (1985); it also reduces participant reactivity (Hawthorne effect)."},{"t":"RIG","q":"Persistent observation means:","o":["Focusing in detail on characteristics and interactions most relevant to the research problem","Observing for as long as possible regardless of focus","Observing covertly","Observing only once"],"a":0,"l":"It adds depth, whereas prolonged engagement adds breadth of time."},{"t":"RIG","q":"Spradley’s nine dimensions for field notes include:","o":["Space, actors, activities, objects, acts, events, time, goals and feelings","Credibility, transferability, dependability and confirmability","Respect, beneficence and justice","Population, phenomenon and context"],"a":0,"l":"They give a systematic checklist for non-verbal and contextual detail."},{"t":"RIG","q":"Field notes must separate:","o":["Objective descriptive logs from subjective observer comments","Participants from the researcher","Data from ethics approval","Transcripts from the audit trail"],"a":0,"l":"Observations not written down do not exist as data."},{"t":"RIG","q":"Denzin’s (1978) four modes of triangulation are:","o":["Methods, data sources, investigators and theory","Credibility, transferability, dependability and confirmability","Coding, categories, themes and memos","Interview, focus group, observation and diary"],"a":0,"l":"Triangulation enriches and validates interpretations rather than seeking a single truth."},{"t":"RIG","q":"Reflexivity means:","o":["Critically examining how the researcher’s position and assumptions influence the study","Eliminating all researcher bias","Hiding researcher background","Repeating the interview"],"a":0,"l":"Subjectivity is a lens to be declared and examined, not eliminated (Tracy)."},{"t":"RIG","q":"Which is a tool for reflexivity?","o":["A running reflexive journal and a positionality statement","A p-value","A Likert scale","A sampling frame"],"a":0,"l":"Reflexivity domains: personal, interpersonal, methodological and contextual."},{"t":"RIG","q":"An audit trail is:","o":["A documented record of methodological and analytical decisions","A financial audit of the study","A list of participants","A statistical output"],"a":0,"l":"It may include transcripts, field notes, code revisions and thematic maps; it strengthens dependability and confirmability."},{"t":"RIG","q":"Peer debriefing aims to:","o":["Provide critical questioning of the analysis by a knowledgeable peer","Reach complete agreement with a colleague","Replace member checking","Increase the sample"],"a":0,"l":"The goal is critical examination, not necessarily agreement."},{"t":"RIG","q":"Negative or deviant case analysis:","o":["Actively searches for data that contradict emerging findings","Removes outliers from the data","Increases the sample size","Counts the themes"],"a":0,"l":"It reduces confirmation bias and makes explanations more nuanced."},{"t":"RIG","q":"NVivo and ATLAS.ti:","o":["Support data management and coding, but do not decide meaningful themes","Automatically generate the correct themes","Replace the researcher’s judgement","Are used for statistical regression"],"a":0,"l":"Key statement: software supports analysis; it does not replace analytical judgement."},{"t":"RIG","q":"Which describes saturation as used in the Group 6 slides?","o":["Further data yield no new codes, themes or theoretical insight","The sample reaches 30","All participants agree","The transcripts are complete"],"a":0,"l":"Information power is a dynamic alternative."},{"t":"RIG","q":"The researcher is called the ‘primary human instrument’ because:","o":["The researcher cannot be separated from the study","Participants hold the instrument","The software collects the data","The ethics committee controls collection"],"a":0,"l":"Therefore subjectivity must be declared and examined."},{"t":"RIG","q":"COREQ is a:","o":["32-item checklist for reporting interviews and focus groups","21-item checklist for broad qualitative research","Statistical test","Qualitative software"],"a":0,"l":"SRQR has 21 items and covers broad qualitative research."},{"t":"RIG","q":"SRQR (Standards for Reporting Qualitative Research) has how many items?","o":["21","32","16","8"],"a":0,"l":"COREQ = 32 items; SRQR = 21 items (O’Brien et al., 2014)."},{"t":"RIG","q":"A common criticism of traditional trustworthiness criteria is that they:","o":["Were developed as parallel versions of quantitative standards","Ignore credibility","Are too new to be used","Require large samples"],"a":0,"l":"Critics say they retain traces of positivist thinking (Rolfe, 2006)."},{"t":"RIG","q":"Contemporary scholars question member checking because:","o":["Participants may change views over time or disagree for reasons unrelated to accuracy","It is too expensive","It cannot be done online","It breaches confidentiality automatically"],"a":0,"l":"Birt et al. (2016); Motulsky (2021)."},{"t":"RIG","q":"Tracy’s (2010) criteria are called:","o":["Eight ‘big-tent’ criteria for excellent qualitative research","Four trustworthiness criteria","Seven ethical principles","Five core pillars"],"a":0,"l":"They include worthy topic, rich rigor, sincerity, credibility, resonance, significant contribution, ethics and meaningful coherence."},{"t":"RIG","q":"Methodological coherence means alignment among:","o":["Philosophy, research question, methodology, sampling, data collection and analysis","Title, abstract and references","Participants, funders and supervisors","Consent, privacy and anonymity"],"a":0,"l":"Creswell & Poth (2018); a key integrative feature of rigour today."},{"t":"RIG","q":"Documenting methodological decisions creates an audit trail that shows:","o":["What was decided, why, and how it influenced the study","Only the final results","Only the participants’ names","Only the reference list"],"a":0,"l":"What = transparency, why = dependability, how = confirmability."},{"t":"RIG","q":"Qualitative rigour emphasises:","o":["Trustworthiness rather than statistical reliability alone","Statistical significance","Large sample sizes","Random assignment"],"a":0,"l":"Researchers should show how raw data became codes, categories, themes and interpretations."},{"t":"RIG","q":"Ethical considerations are part of rigour because:","o":["Ethical relationships generate honest, detailed data and therefore more credible findings","They shorten the study","They remove the need for sampling","They replace triangulation"],"a":0,"l":"Tracy (2010)."},{"t":"TECH","q":"Which of the following is a core qualitative research technique?","o":["In-depth interviews","Randomised controlled trials","Laboratory assays","Chi-square testing"],"a":0,"l":"Techniques: interviews, focus groups, observation, case studies, textual/document analysis."},{"t":"TECH","q":"Qualitative research is primarily interested in:","o":["The ‘how’ and ‘why’ of a phenomenon","‘How many’ and ‘how often’","Statistical prevalence","Effect sizes"],"a":0,"l":"Mulisa (2022)."},{"t":"TECH","q":"Research data management involves:","o":["Planning, organising, storing, protecting, accessing and preserving data","Only analysing data","Only writing the report","Only destroying data"],"a":0,"l":"It is guided by a data management plan."},{"t":"TECH","q":"A data management plan (DMP) should be prepared:","o":["Before data collection begins","After analysis","After publication","Only when requested by a journal"],"a":0,"l":"It covers storage, security, backup, anonymisation, access, retention, sharing and destruction."},{"t":"TECH","q":"Which is NOT usually listed in a DMP?","o":["Choice of the p-value","Backup","Anonymisation","Eventual destruction"],"a":0,"l":"Others: storage, security, access, retention, sharing."},{"t":"TECH","q":"Which are types of data storage?","o":["Physical, electronic, cloud and backup storage","Only physical","Only cloud","Only memory"],"a":0,"l":"Researchers should avoid relying on only one storage location."},{"t":"TECH","q":"Why should a researcher not rely on one storage location?","o":["It reduces the risk of permanent data loss","It lowers the cost","It makes the data anonymous","It satisfies the ethics committee"],"a":0,"l":"Backup storage is one of the four types."},{"t":"TECH","q":"Which is an ethical consideration in data management?","o":["Data minimisation and secure destruction","Maximising data volume","Publishing raw files","Avoiding consent"],"a":0,"l":"Others: confidentiality, informed consent, right to withdraw."},{"t":"TECH","q":"Visual data (photographs, videos, drawings) require special attention to:","o":["Privacy and informed consent","Sample size","Cost","File compression"],"a":0,"l":"Visual data can easily identify participants."},{"t":"TECH","q":"Researcher-generated data include:","o":["Reflexive journals, analytical memos and coding frameworks","Participants’ transcripts only","Government reports","Archived datasets"],"a":0,"l":"They document the researcher’s thinking and decisions."},{"t":"TECH","q":"Data protection is best defined as:","o":["Legal, organisational and technical measures ensuring personal data are handled lawfully and securely","Converting plaintext to ciphertext","Backing up files to the cloud","Deleting all data at once"],"a":0,"l":"Ghana’s Data Protection Act 2012 (Act 843)."},{"t":"TECH","q":"Encryption is:","o":["Converting readable plaintext into unreadable ciphertext using an algorithm and key","A legal framework for privacy","A type of storage","A software for coding"],"a":0,"l":"Encryption is one technical method within wider data protection."},{"t":"TECH","q":"Symmetric encryption uses:","o":["One key for both encryption and decryption (e.g. AES)","A public and a private key (e.g. RSA)","No key at all","Two separate software packages"],"a":0,"l":"Asymmetric encryption uses public and private keys: RSA and ECC."},{"t":"TECH","q":"Asymmetric encryption uses:","o":["A public key and a private key (e.g. RSA, ECC)","One shared key (e.g. AES)","Only passwords","No algorithm"],"a":0,"l":"Symmetric = one key; asymmetric = key pair."},{"t":"TECH","q":"Which is an example of research data needing protection?","o":["Interview recordings and transcripts","Published journal articles","The title of the study","The researcher’s CV"],"a":0,"l":"Others: names, contact details, clinical information, photographs, questionnaire responses."},{"t":"TECH","q":"Which is a type of data protection measure?","o":["Administrative, technical and physical measures","Statistical measures only","Only legal measures","Only verbal assurances"],"a":0,"l":"Plus data-handling measures."},{"t":"TECH","q":"Why does data protection matter in research?","o":["It protects privacy, builds trust and reduces risk of harm such as stigma","It removes the need for consent","It increases sample size","It replaces ethics review"],"a":0,"l":"It also prevents data loss, theft and unauthorised alteration."},{"t":"TECH","q":"Which is a software for qualitative data analysis?","o":["NVivo","SPSS","Stata","Excel solver"],"a":0,"l":"SPSS is used for quantitative analysis. Others: ATLAS.ti and MAXQDA."},{"t":"TECH","q":"NVivo helps researchers to:","o":["Organise, code and analyse text, audio, video, images and social media data","Calculate regression models","Randomise participants","Write the ethics form"],"a":0,"l":"Limna (2023)."},{"t":"TECH","q":"A challenge of NVivo is:","o":["Cost and a steep learning curve","It cannot code text","It cannot store audio","It is not used in social sciences"],"a":0,"l":"Others: training needs and technical/compatibility issues."},{"t":"TECH","q":"ATLAS.ti can be used to:","o":["Code, analyse, organise and visualise text, audio and video, including network diagrams","Only analyse numbers","Only search databases","Only transcribe audio"],"a":0,"l":"It is useful in social science, medicine, linguistics and law."},{"t":"TECH","q":"MAXQDA uses which four main workspaces?","o":["Document System, Code System, Retrieved Segments and Text Browser","Data, Codes, Themes and Reports","Input, Process, Output and Review","Setup, Coding, Memo and Export"],"a":0,"l":"It uses a two-stage coding process."},{"t":"TECH","q":"In MAXQDA’s two-stage coding process:","o":["First-level coding identifies codes from raw data; second-level refines them into categories and variables","First-level is statistical and second-level is thematic","Both stages are automatic","First-level is member checking"],"a":0,"l":"It supports systematic analysis."},{"t":"TECH","q":"A listed challenge of MAXQDA is:","o":["Data overload and balancing contextualisation vs decontextualisation","It cannot import text","It has no coding tools","It cannot store data"],"a":0,"l":"Also: reliability and validity of coding, and statistical limitations of qualitative-derived data."},{"t":"TECH","q":"In the Dr Mensah scenario, where were recordings and notes backed up?","o":["On an encrypted drive locked away","On a personal phone","On a public cloud folder","On a shared office laptop"],"a":0,"l":"Names were also replaced with codes and the key stored in a separate vault."},{"t":"TECH","q":"In the scenario, names were replaced with codes and the key to identities was:","o":["Locked in a separate vault only the PI could open","Printed on each transcript","Stored in the same folder","Sent to participants"],"a":0,"l":"This is pseudonymisation with a separately held key."},{"t":"TECH","q":"Which combination is a good practice from the scenario?","o":["Encryption at rest and in transit plus two-factor authentication","Sharing passwords among the team","Storing files on one laptop","Uploading raw data to social media"],"a":0,"l":"Data protection is a layered system, not one tool."},{"t":"FIND","q":"A qualitative research finding is:","o":["An interpretive product of systematic, reflexive analysis of non-numeric data","A raw transcript","A statistical result","A list of references"],"a":0,"l":"Lim (2025): patterns of meaning such as themes, categories, metaphors or conceptual models."},{"t":"FIND","q":"Qualitative findings are usually labelled as:","o":["Themes, categories, metaphors or conceptual models","Means and standard deviations","P-values","Odds ratios"],"a":0,"l":"They explain how and why people experience a phenomenon in context."},{"t":"FIND","q":"Which strategy strengthens the presentation of qualitative findings?","o":["Giving direct participant quotes to support themes","Removing all quotations","Reporting only numbers","Hiding the context"],"a":0,"l":"Direct evidence adds credibility and richness (Forman et al., 2008)."},{"t":"FIND","q":"Which is a characteristic of qualitative study findings?","o":["Subjective, contextualised and flexible","Objective and context-free","Fixed and rigid","Purely statistical"],"a":0,"l":"Alam & Asmawi (2024)."},{"t":"FIND","q":"Good findings should also:","o":["Directly address the research questions or objectives","Avoid any link to the objectives","Include unrelated themes","Be as long as possible"],"a":0,"l":"Findings should be evidence-based, clear and concise."},{"t":"FIND","q":"The Discussion section comes:","o":["After Results and before Conclusions and Recommendations","Before the Methods","Before the Introduction","After the References"],"a":0,"l":"Omori (2018)."},{"t":"FIND","q":"In a discussion section, the author carries out which three necessary steps?","o":["Interpretation, analysis and explanation","Summary, conclusion and recommendation","Sampling, coding and reporting","Introduction, method and result"],"a":0,"l":"It explains why the results matter and where they fit in the literature."},{"t":"FIND","q":"The tone of the discussion should be:","o":["Scholarly, avoiding judgmental, biased or emotional language","Emotional and personal","Defensive","Apologetic"],"a":0,"l":"Arguments should be based on data, not opinion."},{"t":"FIND","q":"A common error in the discussion section is to:","o":["Substitute a summary for discussion","Compare with previous studies","Mention limitations briefly","Link findings to the research question"],"a":0,"l":"A summary is the purpose of an abstract."},{"t":"FIND","q":"Which is another error to avoid in a discussion?","o":["Making it apologetic by listing all that went wrong","Linking findings to the literature","Explaining unexpected findings","Considering transferability"],"a":0,"l":"Don’t discuss what might have happened if there had been no error."},{"t":"FIND","q":"A discussion should NOT simply:","o":["Restate the data again","Interpret findings","Compare findings with the literature","Admit key limitations"],"a":0,"l":"It should avoid giving the data again."},{"t":"FIND","q":"Research is justified, according to the slides, by:","o":["What it allows the reader to understand","Its practical application alone","Its sample size","Its cost"],"a":0,"l":"Do not justify the study only by claiming practical application."},{"t":"FIND","q":"What should a researcher do if the data suggest concepts not covered in the literature review?","o":["Add a concise literature review of these emergent concepts as a subsection in the discussion","Ignore them","Delete them","Move them to the abstract"],"a":0,"l":"The discussion should still be limited to the Literature Review and the Findings."},{"t":"FIND","q":"Which phrase is used when findings agree with earlier research?","o":["‘These findings are consistent with those of…’","‘These findings did not support…’","‘It is difficult to explain…’","‘This study was unable to demonstrate…’"],"a":0,"l":"Supportive phrases: confirm, agree with, corroborate, are consistent with."},{"t":"FIND","q":"Which phrase is used when findings contradict earlier research?","o":["‘In contrast to earlier findings, however…’","‘This study corroborates…’","‘These results are consistent with…’","‘This confirmed the results of…’"],"a":0,"l":"Contradictory phrases: did not support, were not consistent with, unable to demonstrate."},{"t":"FIND","q":"Which phrase offers an explanation for a result?","o":["‘A possible explanation for this might be…’","‘This study corroborates…’","‘These findings agree with…’","‘The results confirm…’"],"a":0,"l":"Use tentative language when explaining results."},{"t":"FIND","q":"Which structure may a discussion follow?","o":["Interpretation with evidence, comparison with literature, limitations and strengths","Abstract, methods and results","Title, authors and affiliation","References only"],"a":0,"l":"The discussion can be two or three paragraphs; also implications and future research."},{"t":"FIND","q":"Where can some discussion appear in qualitative reports?","o":["Within the results section, followed by a concluding discussion","Only in the abstract","Only in the references","Never within results"],"a":0,"l":"It is common practice in qualitative studies (Omori, 2018)."},{"t":"CONC","q":"Chapter Six of a thesis is:","o":["The concluding chapter that brings together the major findings and explains what follows","The introduction","The literature review","The methodology"],"a":0,"l":"It should be a concise synthesis, not a repeat of the results."},{"t":"CONC","q":"The mnemonic for Chapter Six, S-F-C-I-R-L-F, stands for:","o":["Summary, Findings, Conclusions, Implications, Recommendations, Limitations, Further research","Study, Facts, Charts, Interviews, Reports, Literature, Footnotes","Sample, Focus group, Coding, Interpretation, Reflexivity, Limits, Findings","Summary, Framework, Concepts, Ideas, Results, Lessons, Future"],"a":0,"l":"“Students Find Conclusions Important, Recommend Limitations for Future.”"},{"t":"CONC","q":"A summary of the study should be:","o":["Selective rather than exhaustive","Exhaustive and detailed","A copy of the methodology","A list of references"],"a":0,"l":"It should not repeat the detailed discussions from earlier chapters."},{"t":"CONC","q":"The AIM-F mnemonic stands for:","o":["Aim, Investigation/Method, Main findings, Final conclusion","Analysis, Interview, Memo, Findings","Approach, Implication, Method, Future","Abstract, Introduction, Methods, Findings"],"a":0,"l":"It answers what you wanted to know, how you investigated, what you found and what you concluded."},{"t":"CONC","q":"In AIM-F, the letter ‘I’ stands for:","o":["Investigation/Method","Implications","Introduction","Interpretation"],"a":0,"l":"Include only the most important methodological information."},{"t":"CONC","q":"A summary of findings should NOT:","o":["Introduce new findings","Present major themes concisely","Remain faithful to the data","Organise findings logically"],"a":0,"l":"It should also avoid repeating the detailed results and discussion."},{"t":"CONC","q":"A conclusion is:","o":["The final judgement drawn from the findings that states what can reasonably be concluded","A repetition of the results","A list of recommendations","A description of the sampling"],"a":0,"l":"It should be clear, concise, evidence-based and directly supported by findings."},{"t":"CONC","q":"A good conclusion should NOT:","o":["Introduce new information, findings or arguments","Relate to the objectives","Be evidence-based","Be concise"],"a":0,"l":"Making claims beyond the evidence is a common error."},{"t":"CONC","q":"Implications of research findings answer the question:","o":["What do these findings mean, and why are they important?","What was the sample size?","What software was used?","Who funded the study?"],"a":0,"l":"They concern knowledge, practice, education, administration, policy and further research."},{"t":"CONC","q":"Implications can be drawn for all EXCEPT:","o":["The researcher’s personal income","Professional practice","Education","Policy"],"a":0,"l":"Others: knowledge development, administration, further research."},{"t":"CONC","q":"Recommendations are:","o":["Actions proposed after conclusions and implications, translating findings into realistic evidence-informed actions","A summary of results","Descriptions of limitations","A list of references"],"a":0,"l":"They may target practice, education, administration, policy and further research."},{"t":"CONC","q":"A good recommendation is:","o":["Evidence-informed, specific, realistic, feasible and action-oriented","Vague and general","Unrelated to the findings","Beyond the evidence"],"a":0,"l":"They must be clearly directed and consistent with the study findings."},{"t":"CONC","q":"What is the correct logical sequence in the chapter?","o":["Finding → conclusion → implication → recommendation","Recommendation → finding → conclusion → implication","Implication → recommendation → finding → conclusion","Conclusion → finding → recommendation → implication"],"a":0,"l":"The slides’ simulation example follows this order."},{"t":"CONC","q":"Recommendations should be directed to:","o":["Stakeholders with the role or authority to act","Anyone, regardless of role","Only the researcher","Only participants"],"a":0,"l":"Examples: managers, policymakers, regulators, educators."},{"t":"CONC","q":"Limitations are:","o":["Methodological, practical or contextual constraints that affect interpretation, transfer or generalisation","Ways to hide weaknesses","Recommendations","Participants’ complaints"],"a":0,"l":"Acknowledging them shows transparency and scholarly integrity."},{"t":"CONC","q":"In qualitative research, limitations particularly concern:","o":["Researcher influence, context and transferability","Statistical power","Sampling frame error","Rounding error"],"a":0,"l":"Also participant experiences, reflexivity and coherence."},{"t":"CONC","q":"The coherence chain in qualitative research is:","o":["Data → Analysis → Interpretation → Findings","Findings → Data → Analysis → Interpretation","Interpretation → Data → Findings → Analysis","Analysis → Findings → Data → Interpretation"],"a":0,"l":"Group 9 slide on qualitative limitations."},{"t":"CONC","q":"A small sample should be described as a limitation:","o":["Only if it was not appropriate for the design, purpose and setting","Always","Never","Whenever below 30"],"a":0,"l":"The sample should not automatically be called inadequate."},{"t":"CONC","q":"How should a limitation be written?","o":["Limitation → Potential effect → Boundary of interpretation","Boundary → Limitation → Apology","Effect → Cause → Recommendation","Apology → Limitation → Excuse"],"a":0,"l":"Avoid exaggeration; explain why it matters."},{"t":"CONC","q":"Which is a common error when writing limitations?","o":["Simply listing limitations without explaining their effect","Explaining possible effects","Staying proportionate","Linking to interpretation"],"a":0,"l":"Others: repeating methodology, exaggerating weaknesses."},{"t":"CONC","q":"Which is a common error in recommendations?","o":["Making recommendations unrelated to the findings","Linking them to evidence","Directing them to the right stakeholder","Making them feasible"],"a":0,"l":"Also: unrealistic or beyond-the-evidence recommendations."},{"t":"CONC","q":"Which is a common error in implications?","o":["Repeating findings without explaining their meaning","Linking to context","Explaining significance","Linking to practice"],"a":0,"l":"Also: unsupported claims and ignoring context."},{"t":"CONC","q":"The final chapter should be:","o":["Evidence-based, coherent, context-sensitive and transparent","Long and detailed","Opinion-based","Context-free"],"a":0,"l":"Conclusions and recommendations must connect to the evidence generated."},{"t":"CONC","q":"Which question does the concluding chapter answer?","o":["What limitations should be considered when interpreting the findings?","Which journal to submit to?","How to calculate sample size?","How to randomise?"],"a":0,"l":"Also: what was the study about, what can be concluded, why findings matter, what should be done."},{"t":"REP","q":"Research reporting is:","o":["The systematic presentation of what was planned, done, found and what the findings mean","A press release only","A list of references","An oral presentation only"],"a":0,"l":"Core principles: accuracy, completeness, clarity, transparency, reproducibility and ethical accountability."},{"t":"REP","q":"Dissemination is:","o":["The active, deliberate and targeted communication of research evidence to specific audiences","Passive publishing in a journal only","Collecting data","Analysing data"],"a":0,"l":"Its purpose is to bridge the ‘know-do gap’ (Greenhalgh et al., 2004)."},{"t":"REP","q":"The ‘know-do gap’ is:","o":["The gap between generating evidence and using it in practice","The gap between theory and practice in nursing education only","The gap between two interviews","The gap between samples"],"a":0,"l":"Dissemination and knowledge translation aim to close it."},{"t":"REP","q":"Which reporting guideline applies to qualitative interviews and focus groups?","o":["COREQ","CONSORT","STROBE","PRISMA"],"a":0,"l":"SRQR also applies to qualitative studies in general."},{"t":"REP","q":"Which guideline is for randomised controlled trials?","o":["CONSORT","STROBE","COREQ","CARE"],"a":0,"l":"STROBE = observational studies."},{"t":"REP","q":"Which guideline is for systematic reviews and meta-analyses?","o":["PRISMA","CONSORT","SQUIRE","STARD"],"a":0,"l":"PRISMA-P / SPIRIT are for protocols."},{"t":"REP","q":"Which guideline is for case reports?","o":["CARE","SQUIRE","STARD","SRQR"],"a":0,"l":"SQUIRE = quality improvement studies; STARD = diagnostic accuracy."},{"t":"REP","q":"Which reporting guideline is for observational studies?","o":["STROBE","CONSORT","CARE","SPIRIT"],"a":0,"l":"Levitt et al. (2018)."},{"t":"REP","q":"In Chapter One of a qualitative thesis you would find:","o":["Background, problem statement, purpose, objectives and significance","Themes and quotations","Methodology","Discussion and conclusion"],"a":0,"l":"Chapter Two = literature review; Three = methodology; Four = findings; Five = discussion and conclusion."},{"t":"REP","q":"In Chapter Four of a qualitative thesis you would find:","o":["Themes, subthemes and carefully selected quotations","Literature review","Methodology","Recommendations"],"a":0,"l":"This is the findings chapter."},{"t":"REP","q":"Which chapter covers paradigm, sampling, trustworthiness, reflexivity and ethics?","o":["Chapter Three: Methodology","Chapter One","Chapter Four","Chapter Five"],"a":0,"l":"It also covers setting, participants, data collection and analysis."},{"t":"REP","q":"The thesis coherence check asks whether:","o":["The conclusion stays within the evidence and recommendations are justified","The thesis has many pages","The references are alphabetical only","Every participant is named"],"a":0,"l":"Title–problem–gap–aim–objectives–methods–results–discussion–conclusion–recommendations."},{"t":"REP","q":"A manuscript is:","o":["An unpublished complete draft submitted to a journal, conference or publisher for peer review","A published article","A conference poster","A press statement"],"a":0,"l":"Select the target journal early and follow its guidelines."},{"t":"REP","q":"Authorship should reflect:","o":["Substantive intellectual contribution, drafting or revising, final approval and accountability","Funding alone","Supervision alone","Proofreading alone"],"a":0,"l":"These alone do not qualify someone as an author (ICMJE)."},{"t":"REP","q":"A cover letter to the editor should:","o":["State the research question, main contribution and confirm originality, conflicts and author approval","Repeat the abstract","Include all raw data","Name the reviewers to reject"],"a":0,"l":"Keep it professional, concise and tailored."},{"t":"REP","q":"The title formula suggested is:","o":["Population + phenomenon/intervention + outcome/topic + design/context where useful","Author + date + journal","Abstract + keywords","Hypothesis + p-value"],"a":0,"l":"Avoid unnecessary wording such as ‘A study of…’."},{"t":"REP","q":"Which is a form of passive dissemination?","o":["Publishing papers and academic conference talks","Policy briefs","Photovoice","Community town halls"],"a":0,"l":"Targeted = policy briefs, workshops; active KT = arts-based, photovoice, co-design."},{"t":"REP","q":"Photovoice, arts-based methods and community town halls are examples of:","o":["Active knowledge translation and interaction","Passive dissemination","Plagiarism","Peer review"],"a":0,"l":"Wang & Burris (1997)."},{"t":"REP","q":"Which sequence describes a dissemination strategy?","o":["Identify audience → tailor message → select channel → evaluate reach and impact","Select channel → identify audience → publish","Evaluate → publish → write","Write → submit → forget"],"a":0,"l":"Graham et al. (2006), Knowledge-to-Action Framework."},{"t":"REP","q":"Knowledge translation (KT), as defined by WHO, is:","o":["The synthesis, exchange and application of knowledge by stakeholders to accelerate health benefits","Writing the thesis","Collecting data","Peer review"],"a":0,"l":"KT should be planned from the beginning."},{"t":"REP","q":"In media engagement, researchers sh rocity?","o":["Planning to share findings back with the community","Giving participants a cash payment to ensure attendance","Publishing names for recognition","Limiting access to data"],"a":0,"l":"Reciprocity: what should be given back."},{"t":"ETH","q":"A researcher offers a large cash payment that participants from a poor community cannot refuse. Which principle is MOST at risk?","o":["Voluntariness (undue influence) and justice","Beneficence","Confidentiality","Reflexivity"],"a":0,"l":"Consent must be free from coercion or undue influence."},{"t":"ETH","q":"Participants with intellectual impairment are recruited with their guardians’ permission only. What else is expected?","o":["Simplified assent/consent with ongoing right to withdraw","Nothing further","Removal of the right to withdraw","Public posting of the consent form"],"a":0,"l":"Extra protection for diminished autonomy."},{"t":"ETH","q":"Which best distinguishes ‘anonymity’ from ‘confidentiality’ in a face-to-face interview study?","o":["The researcher knows the participant, so confidentiality is possible but true anonymity is not","Both are guaranteed","Neither is relevant","Anonymity is guaranteed and confidentiality is not"],"a":0,"l":"Pseudonyms protect identity in reports; the researcher still knows who took part."},{"t":"ETH","q":"Under the 2024 Declaration of Helsinki, vulnerability is:","o":["Contextual and dynamic, arising from the research situation","A fixed trait of listed groups","Defined only by age","Removed from the Declaration"],"a":0,"l":"Moved from a static list to a situational concept (Lindholm et al., 2025)."},{"t":"ETH","q":"Which sequence best matches the historical development of codes?","o":["Nuremberg (1947) → Helsinki (1964) → Belmont (1979)","Belmont → Nuremberg → Helsinki","Helsinki → Belmont → Nuremberg","Nuremberg → Belmont → Helsinki"],"a":0,"l":"Codes emerged in response to scandals."},{"t":"ETH","q":"A nurse researcher interviewing bereaved parents feels deeply distress
