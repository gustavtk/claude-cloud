<section class="note" id="n-LR"><h3>Literature review and frameworks <small>Group 1</small></h3>
<ul>
<li>A literature review is a <mark>critical synthesis</mark> of existing knowledge. In qualitative research it is <mark>iterative, flexible and inductive</mark>: done before, during and after data collection.</li>
<li>Qualitative reviews are <mark>less exhaustive</mark> than quantitative ones (landmark studies and recent writing). Quantitative reviews are exhaustive, systematic, deductive and confirmatory.</li>
<li><mark>Deductive</mark>: theory → hypothesis → test with data. <mark>Inductive</mark>: data → patterns → theory.</li>
<li><mark>Theoretical framework</mark> = built from an existing formal theory (Watson, Roy, Meleis). <mark>Conceptual framework</mark> = built by the researcher, often a diagram, when no theory fits.</li>
<li>Justify a framework by: relevance, alignment with objectives, support from earlier studies, power to explain or predict, fit with population and setting, guidance for data work, strengths.</li>
<li>Health Belief Model constructs: <mark>susceptibility, severity, benefits, barriers, cues to action, self-efficacy</mark>.</li>
<li>Framework types: phenomenological (lived experience), grounded theory (new theory from data), ethnographic (shared culture), grand/middle-range nursing theories.</li>
<li>Search: <mark>AND narrows, OR broadens, NOT excludes</mark>, quotation marks for phrases, <mark>*</mark> for truncation. Databases: CINAHL (nursing), PubMed/MEDLINE, PsycINFO, EMBASE, Scopus, Web of Science, Cochrane.</li>
<li>Organise by <mark>theme</mark>, not study by study. Funnel: broad → narrow → gap. Appraise with <mark>CASP</mark>. Use a synthesis matrix.</li>
<li>Synthesis types: thematic, narrative, <mark>meta-ethnography</mark> (translates concepts across studies), framework synthesis, meta-synthesis, critical interpretive synthesis.</li>
<li>Biggest mistake: a <mark>one-paragraph-per-study list</mark> with no integration.</li>
</ul></section>

<section class="note" id="n-SAMP"><h3>Setting, recruitment, population and sampling <small>Group 2</small></h3>
<ul>
<li><mark>Study setting</mark> = the natural environment where participants live the phenomenon. Ethnography → community; case study → one institution; phenomenology → where the experience occurs; narrative → personal environments.</li>
<li>Recruitment: use <mark>multiple channels</mark>, flexible plans, gatekeepers, relationships built before recruitment; monitor and adapt.</li>
<li>Recruitment ethics: informed consent, confidentiality, rapport, sensitivity, <mark>right to withdraw</mark>.</li>
<li>Challenges: small samples, need for information-rich cases, access barriers, reluctance, time and resources.</li>
<li><mark>Target population</mark> = people with the relevant experience. Emphasis is on rich insight, <mark>not representativeness</mark>.</li>
<li>Qualitative sampling is purpose-driven, information-rich, <mark>non-probability</mark>, depth over breadth, flexible, guided by <mark>saturation</mark>.</li>
<li><mark>Purposive</mark> is the most common type. Types include maximum variation, homogeneous, extreme/deviant, typical, critical, criterion, theory-based, opportunistic, snowball, convenience.</li>
<li><mark>Snowball</mark> = participants refer others (hidden populations). <mark>Quota</mark> = fill predetermined categories.</li>
<li><mark>Information power</mark>: narrower aim, specific sample, strong theory and dialogue → smaller sample needed.</li>
</ul></section>

<section class="note" id="n-DATA"><h3>Primary and secondary data <small>Group 4</small></h3>
<ul>
<li>Qualitative data are <mark>non-numerical, rich, contextual, interpretive, flexible</mark>.</li>
<li><mark>Primary</mark>: collected directly by the researcher for this study (interviews, focus groups, observation).</li>
<li>Interviews: structured, semi-structured, unstructured. Strengths: depth and probing. Limits: time, interviewer influence, transcription.</li>
<li>Focus group: <mark>at least six</mark> participants plus a moderator. Limits: dominant voices, confidentiality cannot be guaranteed.</li>
<li>Observation: participant, non-participant, structured, unstructured. Output: field notes. Risk: participants change behaviour.</li>
<li><mark>Secondary</mark>: collected earlier for another purpose. Classes: documentary sources, archived research data, digital/online sources, institutional records.</li>
<li>Secondary: cheap and fast but <mark>low control</mark>, possible data mismatch, missing context, original participants cannot clarify.</li>
<li>Ethics of reuse: was it ethically collected, did consent cover reuse, can people be identified, is it genuinely public, copyright and ownership. <mark>Public does not mean anonymous.</mark></li>
</ul></section>

<section class="note" id="n-ETH"><h3>Ethics in qualitative inquiry <small>Groups 5 and 4</small></h3>
<ul>
<li>Qualitative research is <mark>relational</mark>; the researcher is the primary instrument.</li>
<li><mark>Belmont (1979)</mark>: respect for persons, beneficence, justice. It followed the Tuskegee study.</li>
<li>Informed consent = <mark>information + understanding + voluntariness</mark>. It is an ongoing process.</li>
<li>Five practical pillars: consent, confidentiality, anonymity, no-harm (non-maleficence), reciprocity.</li>
<li>History: <mark>Nuremberg 1947 → Helsinki 1964 (latest revision 2024) → Belmont 1979</mark>. ICN Code of Ethics for Nurses revised 2021 (four elements: people, practice, profession, global health).</li>
<li>Helsinki 2024: vulnerability is <mark>contextual and dynamic</mark>, not a fixed list.</li>
<li>IRB/REC functions: ethical, administrative and scientific review. In Ghana: CHS-EPRC (University of Ghana) and GHS-ERC; dual approval possible. <mark>No data collection before written approval.</mark></li>
<li>Ghanaian REC challenges: few bioethicists, limited funding, no national authority, weak post-approval monitoring.</li>
<li>Special populations: simplified consent, ongoing right to withdraw, psychological support, respectful language, community engagement from design, sharing findings back. Avoid <mark>research fatigue</mark>.</li>
<li>Data security: password protection, limited access, encryption, retention and destruction rules, pseudonyms, caution with cloud and AI tools.</li>
</ul></section>

<section class="note" id="n-RIG"><h3>Methodological rigour <small>Group 6</small></h3>
<ul>
<li>Rigour = systematic, transparent, disciplined use of methods to ensure <mark>trustworthiness</mark>.</li>
<li>Lincoln &amp; Guba: <mark>Credibility (validity), Transferability (generalisability), Dependability (reliability), Confirmability (objectivity)</mark>.</li>
<li>Credibility: prolonged engagement, persistent observation, triangulation, member checking, peer debriefing, negative case analysis.</li>
<li>Transferability: thick description. Dependability: audit trail and external audit. Confirmability: quotes and declared researcher role.</li>
<li>Denzin’s triangulation: <mark>methods, data sources, investigators, theory</mark>.</li>
<li>Spradley’s nine dimensions for field notes: space, actors, activities, objects, acts, events, time, goals, feelings.</li>
<li>Reflexivity: personal, interpersonal, methodological, contextual. Tools: reflexive journal, positionality statement.</li>
<li><mark>NVivo and ATLAS.ti support analysis; they do not replace judgement.</mark></li>
<li>Reporting guides: <mark>COREQ = 32 items</mark> (interviews and focus groups); <mark>SRQR = 21 items</mark> (broad qualitative).</li>
<li>Criticisms: criteria are “parallel” to quantitative ones; one set may not fit all methods; member checking and saturation are questioned. Tracy’s eight “big-tent” criteria are an alternative.</li>
</ul></section>

<section class="note" id="n-TECH"><h3>Techniques, data management, protection and software <small>Group 7</small></h3>
<ul>
<li>Qualitative research asks <mark>how and why</mark>, not how many.</li>
<li>Techniques: in-depth interviews, focus groups, observation, case studies, document analysis.</li>
<li>A <mark>data management plan</mark> is written before collection: storage, security, backup, anonymisation, access, retention, sharing, destruction.</li>
<li>Storage: physical, electronic, cloud, backup. <mark>Never rely on one location.</mark></li>
<li>Data protection = legal, organisational and technical measures (Ghana: Data Protection Act 2012, <mark>Act 843</mark>). Encryption = plaintext → ciphertext; it is one tool within data protection.</li>
<li><mark>Symmetric</mark> encryption = one key (AES). <mark>Asymmetric</mark> = public + private key (RSA, ECC).</li>
<li>Software: <mark>NVivo, ATLAS.ti, MAXQDA</mark> for qualitative; SPSS is quantitative. MAXQDA workspaces: Document System, Code System, Retrieved Segments, Text Browser.</li>
<li>NVivo challenges: cost, training, learning curve. MAXQDA challenges: data overload, decontextualisation, coding reliability.</li>
</ul></section>

<section class="note" id="n-FIND"><h3>Findings and discussion <small>Group 8</small></h3>
<ul>
<li>A qualitative finding is an <mark>interpretive product</mark> of systematic, reflexive analysis: themes, categories, metaphors, models.</li>
<li>Findings are <mark>subjective, contextualised and flexible</mark>; they answer the research questions and use direct quotes.</li>
<li>Discussion follows results and comes before conclusions. Three steps: <mark>interpretation, analysis, explanation</mark>.</li>
<li>Include: key findings with evidence, comparison with earlier studies, strengths, unexpected findings, limitations, implications, future research.</li>
<li>Errors: substituting a summary for discussion, repeating data, justifying by practical use alone, <mark>apologetic tone</mark>, imagining what if no errors.</li>
<li>Language: confirm (“consistent with…”), contradict (“in contrast to earlier findings…”), explain (“a possible explanation…”), suggest (“these findings suggest…”).</li>
</ul></section>

<section class="note" id="n-CONC"><h3>Concluding chapter <small>Group 9</small></h3>
<ul>
<li>Order: <mark>Summary → Findings → Conclusions → Implications → Recommendations → Limitations → Further research</mark> (S-F-C-I-R-L-F).</li>
<li>Summary of the study: <mark>AIM-F</mark> = Aim, Investigation/Method, Main findings, Final conclusion. Keep it selective; add nothing new.</li>
<li><mark>Conclusion</mark> = what can reasonably be concluded; clear, concise, evidence-based, tied to objectives.</li>
<li><mark>Implication</mark> = what the findings mean and why they matter (knowledge, practice, education, administration, policy, research).</li>
<li><mark>Recommendation</mark> = realistic, evidence-informed action for a stakeholder who can act. Do not jump from an isolated finding to an action.</li>
<li><mark>Limitation</mark> → potential effect → boundary of interpretation. Qualitative focus: researcher influence, context, transferability, reflexivity, coherence (data → analysis → interpretation → findings).</li>
<li>A small sample is not automatically a weakness; judge it against design, purpose and setting.</li>
</ul></section>

<section class="note" id="n-REP"><h3>Reporting and dissemination <small>Group 10</small></h3>
<ul>
<li>Pathway: <mark>Research → Report → Disseminate → Translate → Use → Impact</mark>. Dissemination bridges the <mark>know-do gap</mark>.</li>
<li>Guidelines: <mark>COREQ/SRQR</mark> (qualitative), CONSORT (RCT), STROBE (observational), PRISMA (systematic reviews), CARE (case reports), SPIRIT/PRISMA-P (protocols), SQUIRE (quality improvement), STARD (diagnostic accuracy).</li>
<li>Thesis: Ch1 Introduction; Ch2 Literature review; Ch3 Methodology; Ch4 Findings; Ch5 Discussion and conclusion.</li>
<li>Manuscript: choose the journal early, follow its guide, use the checklist, write a cover letter. Authorship needs <mark>intellectual contribution + drafting + approval + accountability</mark>.</li>
<li>Dissemination: passive (papers, talks), targeted (policy briefs, workshops), active KT (photovoice, arts-based, town halls). Steps: audience → message → channel → evaluate.</li>
<li>Media: plain language, 2–3 key messages, protect identity, state limits, <mark>inverted pyramid</mark>.</li>
<li>Plagiarism = using others’ words or ideas without credit. <mark>Fabrication</mark> = inventing data. <mark>Falsification</mark> = manipulating or omitting data. Similarity software does not decide.</li>
<li>APA 7th: (Author, Year); two authors with &amp;; <mark>three or more = et al.</mark>; reference list alphabetical with hanging indent.</li>
</ul></section>

sts","No diversity of members","Excess funding"],"a":0,"l":"Also limited funding and no national authority.","f":0},{"t":"ETH","q":"Data collection may begin only after:","o":["Written ethical approval is received","The consent form is drafted","The proposal is submitted","Participants are identified"],"a":0,"l":"Report adverse events and deviations promptly.","f":0},{"t":"ETH","q":"Which is a safeguard for special populations?","o":["Simplified consent and access to psychological support","Removing the right to withdraw","Using clinical labels","Engaging the community only at recruitment"],"a":0,"l":"Also community engagement and sharing findings back.","f":1},{"t":"ETH","q":"Research fatigue refers to:","o":["Communities tired of being studied repeatedly","Researchers tired after fieldwork","Participants forgetting the study","Committee overload"],"a":0,"l":"Avoid redundant research; ensure new knowledge.","f":0},{"t":"ETH","q":"Which is good data security for qualitative data?","o":["Password protection and limited access","Shared public folders","Keeping identifiers with transcripts","Never deleting data"],"a":0,"l":"Also encryption and retention and destruction rules.","f":0},{"t":"ETH","q":"Which practice protects identity in reporting?","o":["Using pseudonyms or participant codes","Publishing full names","Using quotes that reveal the location","Sharing audio freely"],"a":0,"l":"Also avoid identifying quotations.","f":0},{"t":"ETH","q":"Researcher integrity includes avoiding:","o":["Fabrication, falsification and plagiarism","Open-ended questions","Reflexivity","Purposive sampling"],"a":0,"l":"Also report transparently and acknowledge limitations.","f":0},{"t":"ETH","q":"Ethics codes designed for clinical research may not fit qualitative research because:","o":["Qualitative designs are emergent and evolving","Qualitative research bans interviews","They apply only to children","They require random sampling"],"a":0,"l":"Halai (2006).","f":0},{"t":"ETH","q":"Ghana’s Data Protection Act of 2012 is:","o":["Act 843","Act 29","Act 480","Act 703"],"a":0,"l":"It is the legal framework for personal data.","f":0},{"t":"RIG","q":"Methodological rigour in qualitative research refers to:","o":["Systematic and transparent application of methods to ensure trustworthiness","Reliance on statistical significance","Using the largest sample","Avoiding researcher involvement"],"a":0,"l":"Stenfors et al. (2020); Lincoln & Guba (1985).","f":0},{"t":"RIG","q":"Lincoln and Guba’s trustworthiness criteria are:","o":["Credibility, transferability, dependability and confirmability","Validity, reliability, objectivity and generalisability","Respect, beneficence and justice","Consent, privacy and anonymity"],"a":0,"l":"They are the qualitative answer to validity and reliability.","f":1},{"t":"RIG","q":"Credibility is the qualitative equivalent of:","o":["Validity","Reliability","Generalisability","Objectivity"],"a":0,"l":"Credibility = a plausible, accurate picture of participants’ experience.","f":1},{"t":"RIG","q":"Transferability is the qualitative equivalent of:","o":["Generalisability","Validity","Reliability","Objectivity"],"a":0,"l":"The reader judges whether findings fit their own context.","f":1},{"t":"RIG","q":"Dependability is the qualitative equivalent of:","o":["Reliability","Validity","Generalisability","Objectivity"],"a":0,"l":"Dependability = a logical, traceable, consistent process.","f":1},{"t":"RIG","q":"Confirmability is the qualitative equivalent of:","o":["Objectivity","Reliability","Validity","Generalisability"],"a":0,"l":"Findings should reflect participants, not researcher bias.","f":1},{"t":"RIG","q":"Which of the following mainly supports credibility?","o":["Prolonged engagement and member checking","Audit trail only","Statistical power","Random assignment"],"a":0,"l":"Also persistent observation, peer debriefing, triangulation.","f":0},{"t":"RIG","q":"Which of the following mainly supports transferability?","o":["Thick description of context and participants","Inquiry audit","Reflexive journal only","Random sampling"],"a":0,"l":"Detail on sample, methods and timeframe helps readers judge transfer.","f":0},{"t":"RIG","q":"Which of the following mainly supports dependability?","o":["An audit trail","Thick description","Member checking","Purposive sampling"],"a":0,"l":"An inquiry audit by an outsider also helps.","f":0},{"t":"RIG","q":"Which of the following mainly supports confirmability?","o":["Participant quotes and a stated researcher position","Increasing the sample","Random sampling","Statistical testing"],"a":0,"l":"Details of data collection also help.","f":0},{"t":"RIG","q":"Prolonged engagement means:","o":["Spending enough time in the field to understand context and build rapport","Interviewing each participant many times","Reading for months","Staying after saturation"],"a":0,"l":"It also helps detect misinformation (Lincoln & Guba, 1985).","f":0},{"t":"RIG","q":"Persistent observation means:","o":["Focusing in detail on features most relevant to the problem","Observing for as long as possible","Observing covertly","Observing only once"],"a":0,"l":"It adds depth to prolonged engagement.","f":0},{"t":"RIG","q":"Spradley’s nine dimensions are used for:","o":["Systematic field notes","Statistical analysis","Sampling","Ethical review"],"a":0,"l":"Space, actors, activities, objects, acts, events, time, goals, feelings.","f":1},{"t":"RIG","q":"Good field notes separate:","o":["Descriptive records from the observer’s own comments","Participants from the researcher","Data from approval","Transcripts from the audit trail"],"a":0,"l":"Unwritten observations do not exist as data.","f":0},{"t":"RIG","q":"Denzin’s four types of triangulation are:","o":["Methods, data sources, investigators and theory","Credibility, transferability, dependability, confirmability","Coding, categories, themes, memos","Interview, focus group, diary, survey"],"a":0,"l":"Triangulation enriches and validates interpretations.","f":1},{"t":"RIG","q":"Reflexivity in qualitative research refers to:","o":["Examining how the researcher’s position influences the study","Removing all researcher bias","Hiding researcher background","Repeating interviews"],"a":0,"l":"Subjectivity is declared, not eliminated.","f":0},{"t":"RIG","q":"Which of the following is a tool for reflexivity?","o":["A reflexive journal","A p-value","A Likert scale","A sampling frame"],"a":0,"l":"Also a positionality statement.","f":0},{"t":"RIG","q":"An audit trail is best described as:","o":["A documented record of decisions made during the study","A financial audit","A list of participants","A statistical output"],"a":0,"l":"It strengthens dependability and confirmability.","f":1},{"t":"RIG","q":"Peer debriefing is used to:","o":["Provide critical questioning of the analysis","Reach full agreement","Replace member checking","Increase the sample"],"a":0,"l":"The goal is critical examination, not agreement.","f":0},{"t":"RIG","q":"Negative case analysis involves:","o":["Searching for data that contradict emerging findings","Removing outliers","Increasing the sample","Counting themes"],"a":0,"l":"It reduces confirmation bias.","f":0},{"t":"RIG","q":"NVivo and ATLAS.ti are used to:","o":["Manage and code data, not to decide meaning","Choose themes automatically","Replace the researcher","Run regression"],"a":0,"l":"Software supports analysis; it does not replace judgement.","f":0},{"t":"RIG","q":"The researcher is called the primary instrument because:","o":["The researcher cannot be separated from the study","Participants hold the instrument","Software collects data","The ethics committee collects data"],"a":0,"l":"Hence subjectivity is declared and examined.","f":0},{"t":"RIG","q":"COREQ is a:","o":["32-item checklist for interviews and focus groups","21-item checklist for qualitative research","Statistical test","Qualitative software"],"a":0,"l":"SRQR has 21 items.","f":1},{"t":"RIG","q":"SRQR contains how many items?","o":["21","32","16","8"],"a":0,"l":"COREQ = 32; SRQR = 21 (O’Brien et al., 2014).","f":1},{"t":"RIG","q":"A criticism of the trustworthiness criteria is that they:","o":["Mirror quantitative standards","Ignore credibility","Are too new","Require large samples"],"a":0,"l":"They are seen as “parallel” to validity and reliability (Rolfe, 2006).","f":1},{"t":"RIG","q":"Member checking has been questioned because:","o":["Participants may change views or disagree for other reasons","It is too costly","It cannot be done online","It breaches confidentiality"],"a":0,"l":"Birt et al. (2016); Motulsky (2021).","f":1},{"t":"RIG","q":"Tracy’s “big-tent” criteria are:","o":["Eight criteria for excellent qualitative research","Four trustworthiness criteria","Seven ethical principles","Five pillars"],"a":0,"l":"They include worthy topic, rich rigour, sincerity, credibility, resonance, contribution, ethics, coherence.","f":1},{"t":"RIG","q":"Methodological coherence means alignment of:","o":["Philosophy, question, method, sampling and analysis","Title, abstract and references","Participants, funders and supervisors","Consent, privacy and anonymity"],"a":0,"l":"A key integrative feature of rigour.","f":0},{"t":"RIG","q":"Documenting methodological decisions shows:","o":["What was decided, why, and how it influenced the study","Only the results","Only the participants’ names","Only the references"],"a":0,"l":"What = transparency, why = dependability, how = confirmability.","f":0},{"t":"RIG","q":"Qualitative rigour emphasises:","o":["Trustworthiness rather than statistical reliability","Statistical significance","Large samples","Random assignment"],"a":0,"l":"Show how raw data became codes, themes and interpretations.","f":0},{"t":"RIG","q":"Ethical conduct supports rigour because it:","o":["Produces honest, detailed and credible data","Shortens the study","Removes sampling","Replaces triangulation"],"a":0,"l":"Tracy (2010).","f":0},{"t":"RIG","q":"Rigour in qualitative research is:","o":["Built into the whole process, from design to reporting","Only applied in analysis","A fixed checklist","Achieved by increasing sample size"],"a":0,"l":"It is about transparency, coherence and trustworthiness.","f":0},{"t":"RIG","q":"Rigour matters because it:","o":["Determines whether findings can inform policy and practice","Guarantees significance","Removes participant bias","Replaces ethics approval"],"a":0,"l":"It also reduces researcher bias.","f":0},{"t":"TECH","q":"Which of the following is a qualitative research technique?","o":["In-depth interviews","Randomised controlled trials","Laboratory assays","Chi-square testing"],"a":0,"l":"Techniques: interviews, focus groups, observation, case studies, document analysis.","f":0},{"t":"TECH","q":"Qualitative research is mainly interested in:","o":["The “how” and “why” of a phenomenon","“How many” and “how often”","Prevalence","Effect sizes"],"a":0,"l":"Mulisa (2022).","f":0},{"t":"TECH","q":"Research data management involves:","o":["Planning, organising, storing, protecting and preserving data","Only analysing data","Only writing the report","Only destroying data"],"a":0,"l":"It is guided by a data management plan.","f":0},{"t":"TECH","q":"A data management plan is prepared:","o":["Before data collection begins","After analysis","After publication","Only on journal request"],"a":0,"l":"It outlines how data are handled across the lifecycle.","f":1},{"t":"TECH","q":"Which of the following is NOT usually part of a data management plan?","o":["Choice of the p-value","Backup","Anonymisation","Destruction"],"a":0,"l":"Others: storage, security, access, retention, sharing.","f":1},{"t":"TECH","q":"Types of data storage include:","o":["Physical, electronic, cloud and backup","Only physical","Only cloud","Only memory"],"a":0,"l":"Avoid relying on one storage location.","f":0},{"t":"TECH","q":"A researcher should not rely on a single storage location because:","o":["It risks permanent data loss","It costs more","It makes data anonymous","Ethics committees ban it"],"a":0,"l":"Backup storage is one of the four types.","f":0},{"t":"TECH","q":"Which is an ethical consideration in data management?","o":["Data minimisation","Maximising data volume","Publishing raw files","Avoiding consent"],"a":0,"l":"Also confidentiality, consent, right to withdraw, secure destruction.","f":0},{"t":"TECH","q":"Visual data such as photographs require special attention to:","o":["Privacy and informed consent","Sample size","Cost","Compression"],"a":0,"l":"Visual data can easily identify participants.","f":0},{"t":"TECH","q":"Researcher-generated data include:","o":["Reflexive journals and analytical memos","Participants’ transcripts only","Government reports","Archived datasets"],"a":0,"l":"They document the researcher’s thinking and decisions.","f":0},{"t":"TECH","q":"Data protection refers to:","o":["Legal, organisational and technical measures to protect personal data","Converting plaintext to ciphertext","Backing up to the cloud","Deleting all data"],"a":0,"l":"Ghana’s Data Protection Act 2012 (Act 843).","f":0},{"t":"TECH","q":"Encryption is:","o":["Converting readable data into unreadable ciphertext","A legal framework","A storage type","A coding software"],"a":0,"l":"It is one technical method within data protection.","f":0},{"t":"TECH","q":"Symmetric encryption uses:","o":["One key for encryption and decryption","A public and a private key","No key","Two software packages"],"a":0,"l":"Example: AES.","f":1},{"t":"TECH","q":"Asymmetric encryption uses:","o":["A public key and a private key","One shared key","Only passwords","No algorithm"],"a":0,"l":"Examples: RSA and ECC.","f":1},{"t":"TECH","q":"Which of the following needs data protection in a study?","o":["Interview recordings and transcripts","Published articles","The study title","The researcher’s CV"],"a":0,"l":"Also names, contact details, clinical information, images.","f":0},{"t":"TECH","q":"Types of data protection include:","o":["Administrative, technical and physical measures","Statistical measures only","Legal measures only","Verbal assurances"],"a":0,"l":"Plus data-handling measures.","f":0},{"t":"TECH","q":"Data protection matters because it:","o":["Protects privacy and builds participants’ trust","Removes the need for consent","Increases the sample","Replaces ethics review"],"a":0,"l":"It also prevents data loss and unauthorised alteration.","f":0},{"t":"TECH","q":"Which software is used for qualitative data analysis?","o":["NVivo","SPSS","Stata","Excel solver"],"a":0,"l":"SPSS is for quantitative analysis. Others: ATLAS.ti, MAXQDA.","f":0},{"t":"TECH","q":"NVivo helps researchers to:","o":["Organise, code and analyse text, audio, video and images","Run regression","Randomise participants","Write ethics forms"],"a":0,"l":"Limna (2023).","f":0},{"t":"TECH","q":"A challenge of NVivo is:","o":["Cost and a steep learning curve","It cannot code text","It cannot store audio","It is unused in social science"],"a":0,"l":"Also training needs and technical issues.","f":0},{"t":"TECH","q":"ATLAS.ti can be used to:","o":["Code, organise and visualise text, audio and video data","Analyse only numbers","Search databases only","Transcribe audio only"],"a":0,"l":"It is used in social science, medicine, linguistics and law.","f":0},{"t":"TECH","q":"MAXQDA’s four main workspaces are:","o":["Document System, Code System, Retrieved Segments, Text Browser","Data, Codes, Themes, Reports","Input, Process, Output, Review","Setup, Coding, Memo, Export"],"a":0,"l":"It uses two-stage coding.","f":1},{"t":"TECH","q":"In MAXQDA’s two-stage coding, the second stage:","o":["Refines codes into categories and variables","Identifies raw codes","Is statistical scoring","Is member checking"],"a":0,"l":"The first stage identifies codes from raw data.","f":1},{"t":"TECH","q":"A challenge of using MAXQDA is:","o":["Data overload and loss of context","It cannot import text","It has no coding tools","It cannot store data"],"a":0,"l":"Also coding reliability and statistical limits.","f":1},{"t":"TECH","q":"In the Dr Mensah scenario, recordings were backed up on:","o":["An encrypted drive locked away","A personal phone","A public cloud folder","A shared office laptop"],"a":0,"l":"Names were replaced with codes and the key kept in a separate vault.","f":1},{"t":"TECH","q":"Replacing names with codes and keeping the key separately is called:","o":["Pseudonymisation","Encryption in transit","Data minimisation","Irreversible anonymisation"],"a":0,"l":"The key must be secured separately.","f":0},{"t":"TECH","q":"Which combination reflects good protection in the scenario?","o":["Encryption and two-factor authentication","Shared passwords","One laptop only","Raw data on social media"],"a":0,"l":"Protection is layered, not a single tool.","f":0},{"t":"FIND","q":"A qualitative research finding is best described as:","o":["An interpretive product of systematic analysis of non-numeric data","A raw transcript","A statistical result","A list of references"],"a":0,"l":"Lim (2025): themes, categories, metaphors or conceptual models.","f":0},{"t":"FIND","q":"Qualitative findings are usually presented as:","o":["Themes, categories or conceptual models","Means and standard deviations","P-values","Odds ratios"],"a":0,"l":"They explain how and why people experience a phenomenon in context.","f":0},{"t":"FIND","q":"Which strategy strengthens the presentation of qualitative findings?","o":["Supporting themes with direct participant quotes","Removing all quotations","Reporting only numbers","Hiding the context"],"a":0,"l":"Direct evidence adds credibility and richness (Forman et al., 2008).","f":0},{"t":"FIND","q":"Which of the following is a characteristic of qualitative study findings?","o":["Subjective, contextualised and flexible","Objective and context-free","Fixed and rigid","Purely statistical"],"a":0,"l":"Alam & Asmawi (2024).","f":0},{"t":"FIND","q":"Good qualitative findings should:","o":["Directly address the research questions","Avoid the objectives","Include unrelated themes","Be as long as possible"],"a":0,"l":"They should be evidence-based, clear and concise.","f":0},{"t":"FIND","q":"The discussion section comes:","o":["After the results and before the conclusion","Before the methods","Before the introduction","After the references"],"a":0,"l":"Omori (2018).","f":0},{"t":"FIND","q":"The three necessary steps in a discussion section are:","o":["Interpretation, analysis and explanation","Summary, conclusion and recommendation","Sampling, coding and reporting","Introduction, method and result"],"a":0,"l":"It explains why results matter and where they fit in the literature.","f":1},{"t":"FIND","q":"The tone of a discussion should be:","o":["Scholarly and unbiased","Emotional","Defensive","Apologetic"],"a":0,"l":"Arguments should be based on data, not opinion.","f":0},{"t":"FIND","q":"Which of the following is a common error in a discussion?","o":["Substituting a summary for discussion","Comparing with previous studies","Mentioning limitations briefly","Linking to the research question"],"a":0,"l":"A summary is the purpose of an abstract.","f":1},{"t":"FIND","q":"Which of the following is another error to avoid in a discussion?","o":["Making it apologetic by listing everything that went wrong","Linking findings to literature","Explaining unexpected findings","Considering transferability"],"a":0,"l":"Do not imagine what might have happened without errors.","f":0},{"t":"FIND","q":"A discussion should NOT simply:","o":["Restate the data","Interpret findings","Compare with the literature","Admit key limitations"],"a":0,"l":"Avoid giving the data again.","f":0},{"t":"FIND","q":"According to the slides, research is justified by:","o":["What it allows the reader to understand","Its practical application alone","Its sample size","Its cost"],"a":0,"l":"Do not justify a study only by its practical use.","f":0},{"t":"FIND","q":"If data suggest a concept not covered in the literature review, the researcher should:","o":["Add a short review of it in the discussion","Ignore it","Delete it","Move it to the abstract"],"a":0,"l":"Still limit the discussion to the literature review and findings.","f":0},{"t":"FIND","q":"Which phrase is used when findings agree with earlier research?","o":["“These findings are consistent with…”","“These findings did not support…”","“It is difficult to explain…”","“This study was unable to show…”"],"a":0,"l":"Supportive phrases: confirm, agree with, corroborate.","f":0},{"t":"FIND","q":"Which phrase is used when findings contradict earlier research?","o":["“In contrast to earlier findings…”","“This study corroborates…”","“These results are consistent with…”","“This confirmed the results of…”"],"a":0,"l":"Contrasting phrases: did not support, not consistent with.","f":0},{"t":"FIND","q":"Which phrase is used to offer an explanation for a result?","o":["“A possible explanation for this might be…”","“This study corroborates…”","“These findings agree with…”","“The results confirm…”"],"a":0,"l":"Use tentative language when explaining results.","f":0},{"t":"FIND","q":"A discussion may include:","o":["Key findings, comparison with literature, strengths and limitations","Abstract and keywords","Title and authors","Reference list only"],"a":0,"l":"Also implications and future research.","f":0},{"t":"FIND","q":"Where can some discussion appear in qualitative reports?","o":["Within the results section, followed by a concluding discussion","Only in the abstract","Only in the references","Never in the results"],"a":0,"l":"Common practice (Omori, 2018).","f":0},{"t":"CONC","q":"Chapter Six of a thesis is:","o":["The concluding chapter","The introduction","The literature review","The methodology"],"a":0,"l":"It is a concise synthesis, not a repeat of results.","f":0},{"t":"CONC","q":"The mnemonic S-F-C-I-R-L-F stands for:","o":["Summary, Findings, Conclusions, Implications, Recommendations, Limitations, Further research","Study, Facts, Charts, Interviews, Reports, Literature, Footnotes","Sample, Focus group, Coding, Interpretation, Reflexivity, Limits, Findings","Summary, Framework, Concepts, Ideas, Results, Lessons, Future"],"a":0,"l":"“Students Find Conclusions Important, Recommend Limitations for Future.”","f":1},{"t":"CONC","q":"A summary of the study should be:","o":["Selective, not exhaustive","Exhaustive and detailed","A copy of the methodology","A list of references"],"a":0,"l":"It should not repeat earlier chapters.","f":0},{"t":"CONC","q":"The mnemonic AIM-F stands for:","o":["Aim, Investigation, Main findings, Final conclusion","Analysis, Interview, Memo, Findings","Approach, Implication, Method, Future","Abstract, Introduction, Methods, Findings"],"a":0,"l":"It answers: what did you want to know, how did you investigate, what did you find, what did you conclude.","f":1},{"t":"CONC","q":"In AIM-F, the letter “I” stands for:","o":["Investigation (method)","Implications","Introduction","Interpretation"],"a":0,"l":"Include only the key methodological information.","f":1},{"t":"CONC","q":"A summary of findings should NOT:","o":["Introduce new findings","Present major themes concisely","Stay faithful to the data","Organise findings logically"],"a":0,"l":"It also avoids repeating results and discussion.","f":0},{"t":"CONC","q":"A conclusion is best described as:","o":["The final judgement drawn from the findings","A repetition of results","A list of recommendations","A description of sampling"],"a":0,"l":"It should be clear, concise, evidence-based and linked to objectives.","f":0},{"t":"CONC","q":"A good conclusion should NOT:","o":["Introduce new information or arguments","Relate to the objectives","Be evidence-based","Be concise"],"a":0,"l":"Claims beyond the evidence are a common error.","f":0},{"t":"CONC","q":"Implications of findings answer the question:","o":["What do the findings mean and why are they important?","What was the sample size?","Which software was used?","Who funded the study?"],"a":0,"l":"They concern knowledge, practice, education, administration, policy and research.","f":1},{"t":"CONC","q":"Implications can be drawn for all of the following EXCEPT:","o":["The researcher’s personal income","Professional practice","Education","Policy"],"a":0,"l":"Others: knowledge development, administration, further research.","f":0},{"t":"CONC","q":"Recommendations are best described as:","o":["Realistic, evidence-informed actions proposed from the findings","A summary of results","A description of limitations","A list of references"],"a":0,"l":"They may target practice, education, administration, policy and research.","f":0},{"t":"CONC","q":"A good recommendation is:","o":["Evidence-informed, specific, realistic and feasible","Vague and general","Unrelated to findings","Beyond the evidence"],"a":0,"l":"It must be clearly directed and consistent with the findings.","f":0},{"t":"CONC","q":"What is the correct sequence in the concluding chapter?","o":["Finding, conclusion, implication, recommendation","Recommendation, finding, conclusion, implication","Implication, recommendation, finding, conclusion","Conclusion, finding, recommendation, implication"],"a":0,"l":"The slides’ simulation example follows this order.","f":0},{"t":"CONC","q":"Recommendations should be directed to:","o":["Stakeholders with the authority to act","Anyone","Only the researcher","Only participants"],"a":0,"l":"Examples: managers, policymakers, regulators, educators.","f":0},{"t":"CONC","q":"Limitations are best described as:","o":["Constraints that affect interpretation, transfer or generalisation","Ways to hide weaknesses","Recommendations","Participants’ complaints"],"a":0,"l":"They show transparency and scholarly integrity.","f":0},{"t":"CONC","q":"In qualitative research, limitations particularly concern:","o":["Researcher influence, context and transferability","Statistical power","Sampling frame error","Rounding error"],"a":0,"l":"Also reflexivity, participant experiences and coherence.","f":0},{"t":"CONC","q":"The coherence chain in qualitative research is:","o":["Data, analysis, interpretation, findings","Findings, data, analysis, interpretation","Interpretation, data, findings, analysis","Analysis, findings, data, interpretation"],"a":0,"l":"Group 9 slide on qualitative limitations.","f":1},{"t":"CONC","q":"A small sample should be written as a limitation:","o":["Only if it did not suit the design and purpose","Always","Never","Whenever below 30"],"a":0,"l":"The sample should not automatically be called inadequate.","f":0},{"t":"CONC","q":"The recommended way to write a limitation is:","o":["Limitation, potential effect, boundary of interpretation","Boundary, limitation, apology","Effect, cause, recommendation","Apology, limitation, excuse"],"a":0,"l":"Avoid exaggeration; explain why it matters.","f":1},{"t":"CONC","q":"Which is a common error in writing limitations?","o":["Listing limitations without explaining their effect","Explaining possible effects","Staying proportionate","Linking to interpretation"],"a":0,"l":"Others: repeating methodology and exaggerating weaknesses.","f":0},{"t":"CONC","q":"Which is a common error in recommendations?","o":["Making recommendations unrelated to the findings","Linking them to evidence","Directing them to the right stakeholder","Making them feasible"],"a":0,"l":"Also unrealistic or beyond-evidence recommendations.","f":0},{"t":"CONC","q":"Which is a common error in implications?","o":["Repeating findings without explaining their meaning","Linking to context","Explaining significance","Linking to practice"],"a":0,"l":"Also unsupported claims and ignoring context.","f":0},{"t":"CONC","q":"The final chapter should be:","o":["Evidence-based, coherent, context-sensitive and transparent","Long and detailed","Opinion-based","Context-free"],"a":0,"l":"Conclusions and recommendations must connect to the evidence.","f":0},{"t":"CONC","q":"Which question does the concluding chapter answer?","o":["What limitations affect how the findings are interpreted?","Which journal should I submit to?","How is sample size calculated?","How are participants randomised?"],"a":0,"l":"Also: what was the study about, what can be concluded, why it matters, what should be done.","f":0},{"t":"REP","q":"Research reporting is best described as:","o":["The systematic presentation of what was planned, done and found","A press release only","A list of references","An oral talk only"],"a":0,"l":"Principles: accuracy, completeness, clarity, transparency, reproducibility.","f":0},{"t":"REP","q":"Dissemination is best described as:","o":["Active, targeted communication of research evidence to specific audiences","Publishing in a journal only","Collecting data","Analysing data"],"a":0,"l":"Its purpose is to bridge the know-do gap (Greenhalgh et al., 2004).","f":0},{"t":"REP","q":"The “know-do gap” refers to:","o":["The gap between evidence and its use in practice","The gap between two interviews","The gap between samples","The gap between theory and ethics"],"a":0,"l":"Dissemination and knowledge translation aim to close it.","f":0},{"t":"REP","q":"Which guideline is used for reporting qualitative interviews and focus groups?","o":["COREQ","CONSORT","STROBE","PRISMA"],"a":0,"l":"SRQR also covers qualitative studies in general.","f":1},{"t":"REP","q":"Which guideline is used for randomised controlled trials?","o":["CONSORT","STROBE","COREQ","CARE"],"a":0,"l":"STROBE is for observational studies.","f":1},{"t":"REP","q":"Which guideline is used for systematic reviews and meta-analyses?","o":["PRISMA","CONSORT","SQUIRE","STARD"],"a":0,"l":"PRISMA-P and SPIRIT are for protocols.","f":1},{"t":"REP","q":"Which guideline is used for case reports?","o":["CARE","SQUIRE","STARD","SRQR"],"a":0,"l":"SQUIRE: quality improvement; STARD: diagnostic accuracy.","f":1},{"t":"REP","q":"Which guideline is used for observational studies?","o":["STROBE","CONSORT","CARE","SPIRIT"],"a":0,"l":"Levitt et al. (2018).","f":1},{"t":"REP","q":"Chapter One of a qualitative thesis contains:","o":["Background, problem statement, objectives and significance","Themes and quotations","Methodology","Discussion and conclusion"],"a":0,"l":"Ch2 literature review; Ch3 methodology; Ch4 findings; Ch5 discussion.","f":1},{"t":"REP","q":"Chapter Four of a qualitative thesis contains:","o":["Themes, subthemes and participant quotations","Literature review","Methodology","Recommendations"],"a":0,"l":"This is the findings chapter.","f":1},{"t":"REP","q":"Which chapter covers paradigm, sampling, trustworthiness and ethics?","o":["Chapter Three (Methodology)","Chapter One","Chapter Four","Chapter Five"],"a":0,"l":"It also covers setting, participants, collection and analysis.","f":0},{"t":"REP","q":"The thesis coherence check asks whether:","o":["The conclusion stays within the evidence","The thesis is long","References are alphabetical","Every participant is named"],"a":0,"l":"Title–problem–gap–aim–objectives–methods–results–discussion–conclusion–recommendations.","f":1},{"t":"REP","q":"A manuscript is best described as:","o":["An unpublished draft submitted for peer review","A published article","A conference poster","A press statement"],"a":0,"l":"Select the target journal early.","f":0},{"t":"REP","q":"Authorship should reflect:","o":["Intellectual contribution, drafting, approval and accountability","Funding alone","Supervision alone","Proofreading alone"],"a":0,"l":"These alone do not qualify someone as an author.","f":0},{"t":"REP","q":"A cover letter to the editor should:","o":["State the contribution and confirm originality and author approval","Repeat the abstract","Include raw data","Name reviewers to reject"],"a":0,"l":"Keep it professional, concise and tailored.","f":0},{"t":"REP","q":"The suggested title formula is:","o":["Population, phenomenon, outcome or topic, design or context","Author, date, journal","Abstract and keywords","Hypothesis and p-value"],"a":0,"l":"Avo ","The ethical considerations of the study","The numerical accuracy of the data collected"],"a":0,"l":"","ns":true,"t":"","n":76},{"q":"What is the main purpose of “triangulation” in qualitative research?","o":["To increase the statistical power of the study","To verify findings by using multiple methods or sources","To select a random sample","To perform statistical analyses"],"a":1,"l":"","ns":true,"t":"","n":77},{"q":"Which of the following is an example of a “phenomenological” approach in qualitative research?","o":["Studying the lived experiences of individuals who have undergone a specific phenomenon","Conducting a large-scale survey on health behaviors","Analyzing the economic impact of a public policy","Testing a new educational intervention in a controlled setting"],"a":0,"l":"","ns":true,"t":"","n":78},{"q":"Which qualitative research method is most appropriate for studying the language and communication patterns within a community?","o":["Ethnography","Grounded theory","Discourse analysis","Phenomenology"],"a":2,"l":"","ns":true,"t":"","n":79},{"q":"Which of the following is NOT a common data collection method in qualitative research?","o":["Interviews","Surveys with closed-ended questions","Observations","Focus groups"],"a":1,"l":"","ns":true,"t":"","n":80},{"q":"Which of the following best describes “grounded theory”?","o":["A theory developed and tested in a controlled experiment","A theory derived inductively from the data collected during the research process","A theory that is pre-existing and used to guide data collection","A theory based on the statistical analysis of numerical data"],"a":1,"l":"","ns":true,"t":"","n":81},{"q":"What is the primary purpose of using “field notes” in qualitative research?","o":["To record numerical data for statistical analysis","To document the researcher’s observations, thoughts, and reflections during data collection","To summarize the results of the study","To create a coding framework"],"a":1,"l":"","ns":true,"t":"","n":82},{"q":"In qualitative research, “analytic memoing” refers to:","o":["Writing statistical summaries of the data","Recording and reflecting on the coding process and emerging themes","Creating a structured interview guide","Conducting a literature review"],"a":1,"l":"","ns":true,"t":"","n":83},{"q":"Which of the following best describes the role of “theoretical sampling” in grounded theory?","o":["Selecting participants randomly to increase generalizability","Selecting participants based on emerging theoretical concepts to further develop theory","Ensuring an equal representation of all demographic groups","Using a predetermined sample size for statistical analysis"],"a":1,"l":"","ns":true,"t":"","n":84},{"q":"What is the purpose of conducting a “pilot study” in qualitative research?","o":["To test the feasibility of the research design and methods before the main study","To collect a large sample for statistical testing","To finalize the coding framework","To perform the final analysis of the data"],"a":0,"l":"","ns":true,"t":"","n":85},{"q":"In qualitative research, “epistemology” refers to:","o":["The study of statistical methods","The philosophical study of knowledge, including its nature and origins","The coding of qualitative data","The practical application of research findings"],"a":1,"l":"","ns":true,"t":"","n":86},{"q":"Which of the following is an example of “purposive sampling” in qualitative research?","o":["Randomly selecting participants from a large population","Selecting participants who are most knowledgeable about the research topic","Ensuring an equal distribution of participants across demographic groups","Using statistical methods to select participants"],"a":1,"l":"","ns":true,"t":"","n":87},{"q":"What does the term “contextualization” mean in qualitative research?","o":["Analyzing data without considering the context in which it was collected","Understanding and interpreting data within the context in which it was collected","Using context-free variables in data analysis","Randomly assigning participants to different contexts"],"a":1,"l":"","ns":true,"t":"","n":88},{"q":"Which of the following best describes the concept of “thick description” in qualitative research?","o":["Providing a detailed and rich account of the research context and participants’ experiences","Reporting only the numerical results of a study","Using statistical tests to analyze qualitative data","Summarizing the key findings in a brief manner"],"a":0,"l":"","ns":true,"t":"","n":89},{"q":"Which of the following is a potential disadvantage of using interviews in qualitative research?","o":["The ability to gather in-depth information","The possibility of interviewer bias influencing participants’ responses","The flexibility to explore new topics","The opportunity to clarify questions for participants"],"a":1,"l":"","ns":true,"t":"","n":90},{"q":"In qualitative research, “axial coding” refers to:","o":["The initial process of breaking down data into discrete parts","The process of reassembling data after open coding to identify relationships between categories","The final stage of coding where themes are developed","The use of statistical software to code data"],"a":1,"l":"","ns":true,"t":"","n":91},{"q":"Which of the following is a key characteristic of “phenomenology” as a qualitative research approach?","o":["It aims to generate a new theory based on data","It focuses on understanding the essence of lived experiences","It involves the analysis of language and communication","It relies on numerical data to draw conclusions"],"a":1,"l":"","ns":true,"t":"","n":92},{"q":"What is the primary goal of “coding” in qualitative data analysis?","o":["To reduce the data into numerical form for statistical analysis","To organize and categorize data to identify patterns and themes","To increase the sample size of the study","To apply experimental controls to the study"],"a":1,"l":"","ns":true,"t":"","n":93},{"q":"Which of the following is an example of “negative case analysis” in qualitative research?","o":["Selecting only cases that support the findings","Using a statistical test to confirm reliability","Conducting the analysis with a larger sample size","Examining cases that do not fit the emerging pattern or theory"],"a":3,"l":"","ns":true,"t":"","n":94},{"q":"In qualitative research, the term “hermeneutics” is associated with:","o":["The interpretation of texts, meaning, and understanding","The measurement of participants’ behavior","The random selection of participants","The use of control groups in experiments"],"a":0,"l":"","ns":true,"t":"","n":95},{"q":"Which of the following is a characteristic of “participatory action research” (PAR)?","o":["The researcher acts as an objective observer, detached from the participants","The research is conducted with the active participation of the community or group being studied","The study is focused on generating statistical data for policy decisions","The findings are meant to remain confidential and not shared with participants"],"a":1,"l":"","ns":true,"t":"","n":96},{"q":"The concept of “transferability” in qualitative research is similar to which concept in quantitative research?","o":["Validity","Reliability","Generalizability","Statistical significance"],"a":2,"l":"","ns":true,"t":"","n":97},{"q":"In qualitative research, what is the purpose of using “open coding”?","o":["To create a detailed coding framework before data collection","To break down qualitative data into discrete parts and label them with codes","To increase the sample size for better reliability","To perform statistical analysis on qualitative data"],"a":1,"l":"","ns":true,"t":"","n":98},{"q":"Which of the following best describes the “constant comparative method” in grounded theory?","o":["Comparing the research findings with pre-existing theories","Continuously comparing data with emerging categories and concepts during analysis","Continuously comparing participants across different contexts","Randomly assigning participants to comparison groups"],"a":1,"l":"","ns":true,"t":"","n":99},{"q":"Which of the following would be considered a limitation of qualitative research?","o":["The ability to explore in-depth understanding","The potential for researcher bias influencing participants’ perspectives","The focus on understanding participants’ experiences","The use of small, purposive samples"],"a":3,"l":"","ns":true,"t":"","n":100}]};
const NOTES = document.getElementById("notesTpl").innerHTML;
const TOPICS = {
  LR: "Literature review", SAMP: "Sampling and setting", DATA: "Primary/secondary data",
  ETH: "Ethics", RIG: "Rigour", TECH: "Data management and software",
  FIND: "Findings and discussion", CONC: "Concluding chapter", REP: "Reporting and dissemination"
};
const TABS = [
  ["practice", "Practice", "250 questions in the style of your past paper, drawn from the group presentations. Questions marked Likely exam cover points the presenters stressed (mnemonics, checklists, tables, scenarios, discussion questions)."],
  ["hard", "Hard", "100 harder questions: scenarios, ‘best answer’ items and look-alike concepts."],
  ["past", "Past questions", "The 100 past questions from your photos."],
  ["notes", "Notes", "Highlighted summaries of every presentation, your saved key points, and a space for your own notes."]
];
const LS = "nursq-v1";
let st = { ans: {}, saved: {}, notes: "" };
try { const r = JSON.parse(localStorage.getItem(LS) || "null"); if (r && r.ans) st = Object.assign(st, r); } catch (e) {}
function persist() { try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {} }

let tab = "practice", topic = "all", filter = "all", orders = {};
const $ = id => document.getElementById(id);
const L = ["a", "b", "c", "d"];

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function perm(id, n, keep) {
  const a = Array.from({ length: n }, (_, i) => i);
  if (keep) return a;
  let s = hash(id) || 1;
  const rnd = () => { s = Math.imul(s ^ (s >>> 15), 1 | s); s ^= s + Math.imul(s ^ (s >>> 7), 61 | s); return ((s ^ (s >>> 14)) >>> 0) / 4294967296; };
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const items = key => BANK[key].map((q, i) => Object.assign({ id: key + ":" + i, n: i + 1 }, q));
const ITEMS = { practice: items("practice"), hard: items("hard"), past: items("past") };

function tabStats(key) {
  let ok = 0, no = 0;
  ITEMS[key].forEach(q => { const c = st.ans[q.id]; if (c === undefined) return; c === q.a ? ok++ : no++; });
  return { ok, no, ans: ok + no, tot: ITEMS[key].length };
}
function header() {
  const tb = $("tabs"); tb.innerHTML = "";
  TABS.forEach(([k, name]) => {
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", k === tab);
    b.textContent = name; b.onclick = () => { tab = k; topic = "all"; filter = "all"; render(); window.scrollTo(0, 0); };
    tb.appendChild(b);
  });
  const sw = $("sAns").parentNode.parentNode;
  if (tab === "notes") { sw.hidden = true; $("bar").style.width = "0"; return; }
  sw.hidden = false;
  const s = tabStats(tab);
  $("sAns").textContent = s.ans; $("sTot").textContent = s.tot; $("sOk").textContent = s.ok; $("sNo").textContent = s.no;
  $("bar").style.width = (s.ans / s.tot * 100) + "%";
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function render() {
  header();
  $("intro").textContent = TABS.find(t => t[0] === tab)[2];
  const v = $("view"); v.innerHTML = "";
  if (tab === "notes") return renderNotes(v);
  renderQuiz(v);
}

function renderQuiz(v) {
  const bar = el("div", "bar");
  if (tab !== "past") {
    const present = Object.keys(TOPICS).filter(k => ITEMS[tab].some(q => q.t === k));
    [["all", "All topics"]].concat(present.map(k => [k, TOPICS[k]])).forEach(([k, name]) => {
      const c = el("button", "chip", name); c.setAttribute("aria-pressed", topic === k);
      c.onclick = () => { topic = k; render(); }; bar.appendChild(c);
    });
  }
  v.appendChild(bar);
  const bar2 = el("div", "bar");
  const mk = (txt, on, fn) => { const b = el("button", "tool", txt); b.setAttribute("aria-pressed", on); b.onclick = fn; bar2.appendChild(b); return b; };
  if (tab !== "past") mk("Likely exam only", filter === "lk", () => { filter = filter === "lk" ? "all" : "lk"; render(); });
  mk("Unanswered only", filter === "un", () => { filter = filter === "un" ? "all" : "un"; render(); });
  mk("Wrong only", filter === "wr", () => { filter = filter === "wr" ? "all" : "wr"; render(); });
  mk("Shuffle order", false, () => {
    const a = ITEMS[tab].map(q => q.id);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    orders[tab] = a; render();
  });
  const rs = mk("Reset this tab", false, null);
  let armed = false, t;
  rs.onclick = () => {
    if (!armed) { armed = true; rs.textContent = "Tap again to clear answers"; t = setTimeout(() => { armed = false; rs.textContent = "Reset this tab"; }, 3000); return; }
    clearTimeout(t); ITEMS[tab].forEach(q => delete st.ans[q.id]); persist(); render();
  };
  v.appendChild(bar2);

  const list = orders[tab] ? orders[tab].map(id => ITEMS[tab].find(q => q.id === id)) : ITEMS[tab];
  let shown = 0;
  list.forEach(q => {
    const c = st.ans[q.id], done = c !== undefined;
    if (topic !== "all" && q.t !== topic) return;
    if (filter === "lk" && !q.f) return;
    if (filter === "un" && done) return;
    if (filter === "wr" && !(done && c !== q.a)) return;
    shown++;
    const card = el("div", "q");
    const qh = el("div", "qh"); qh.appendChild(el("span", "tag", q.t ? TOPICS[q.t] : "Past question"));
    if (q.f) qh.appendChild(el("span", "likely", "Likely exam"));
    card.appendChild(qh);
    const h = el("h2"); h.appendChild(el("span", "", q.n + ".")); h.appendChild(document.createTextNode(q.q)); card.appendChild(h);
    const order = perm(q.id, q.o.length, q.ns);
    order.forEach((raw, pos) => {
      const b = el("button", "opt"); b.appendChild(el("b", "", L[pos] + ")")); b.appendChild(document.createTextNode(q.o[raw]));
      if (done) {
        b.disabled = true;
        if (raw === q.a) b.classList.add("correct"); else if (raw === c) b.classList.add("wrong");
      } else b.onclick = () => { st.ans[q.id] = raw; persist(); render(); };
      card.appendChild(b);
    });
    if (done) {
      const cp = order.indexOf(q.a);
      const m = el("div", "msg " + (c === q.a ? "good" : "bad"),
        (c === q.a ? "Correct. " : "Wrong. ") + "The correct answer is " + L[cp] + ") " + q.o[q.a]);
      card.appendChild(m);
      if (q.l) {
        const lr = el("div", "learn"); const p = el("p"); p.appendChild(el("strong", "", "Key point: ")); p.appendChild(document.createTextNode(q.l)); lr.appendChild(p);
        const sv = el("button", "save", st.saved[q.id] ? "Saved to notes" : "Save to notes"); sv.setAttribute("aria-pressed", !!st.saved[q.id]);
        sv.onclick = () => { if (st.saved[q.id]) delete st.saved[q.id]; else st.saved[q.id] = 1; persist(); sv.textContent = st.saved[q.id] ? "Saved to notes" : "Save to notes"; sv.setAttribute("aria-pressed", !!st.saved[q.id]); };
        lr.appendChild(sv); card.appendChild(lr);
      }
    }
    v.appendChild(card);
  });
  if (!shown) v.appendChild(el("div", "empty", "No questions match this filter."));
  const s = tabStats(tab);
  if (s.ans === s.tot) {
    const d = el("div", "box done", "Finished. You scored " + s.ok + " out of " + s.tot + " (" + Math.round(s.ok / s.tot * 100) + "%).");
    v.appendChild(d);
  }
}

function renderNotes(v) {
  const jump = el("div", "bar");
  Object.keys(TOPICS).forEach(k => { const c = el("button", "chip", TOPICS[k]); c.onclick = () => { const e = document.getElementById("n-" + k); if (e) e.scrollIntoView({ behavior: "smooth", block: "start" }); }; jump.appendChild(c); });
  v.appendChild(jump);
  const nb = el("div"); nb.innerHTML = NOTES; v.appendChild(nb);

  const sb = el("div", "box"); sb.appendChild(el("h3", "", "Saved key points"));
  const ids = Object.keys(st.saved);
  if (!ids.length) sb.appendChild(el("div", "empty", "Answer a question and tap ‘Save to notes’ to collect key points here."));
  ids.forEach(id => {
    const [k, i] = id.split(":"); const q = ITEMS[k] && ITEMS[k][+i]; if (!q) return;
    const row = el("div", "sv"); row.appendChild(el("small", "", (q.t ? TOPICS[q.t] : "") + " · " + q.q));
    row.appendChild(document.createTextNode(q.l));
    const rm = el("button", "rm", "Remove"); rm.onclick = () => { delete st.saved[id]; persist(); render(); };
    row.appendChild(el("br")); row.appendChild(rm); sb.appendChild(row);
  });
  v.appendChild(sb);

  const mb = el("div", "box"); mb.appendChild(el("h3", "", "My notes"));
  const ta = document.createElement("textarea"); ta.id = "myNotes"; ta.placeholder = "Type your own notes here. They save automatically in this browser.";
  ta.value = st.notes || ""; ta.oninput = () => { st.notes = ta.value; persist(); };
  mb.appendChild(ta); v.appendChild(mb);
}

render();
})();
</script>
